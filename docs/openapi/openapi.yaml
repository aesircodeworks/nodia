            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderNotFoundProblem'
  /v1/orders/{order}/resend-tickets:
    parameters:
      - name: order
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resendOrderTickets
      summary: Queue a ticket resend for a paid order
      description: >-
        Tenant admin surface behind orders.resend_tickets, audited
        (stage-07 plan, Endpoints). A dormant dispatch seam until Stage
        8a's email and PDF consumers exist; the qr_rotation_counter bump
        ships with that activation task, so payloads are only
        invalidated when new tickets actually go out.
      security:
        - BearerAuth: []
      responses:
        '202':
          description: The resend is accepted.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            No membership in the asserted tenant, missing
            orders.resend_tickets, or unconfirmed mandated MFA.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StaffCapabilityForbiddenProblem'
        '404':
          description: >-
            Missing or other tenant via RLS (code order_not_found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderNotFoundProblem'
        '409':
          description: The order has no issued tickets (code order_not_paid).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderNotPaidProblem'
  /v1/promo-codes:
    get:
      operationId: listPromoCodes
      summary: List promo codes in the acting tenant
      description: >-
        Tenant admin surface behind promo_codes.manage (stage-07 plan,
        Endpoints). A bounded collection, page-paginated. Allowed
        query-builder parameters are filter[code] (exact),
        filter[active] (validity window against now), and sort in
        (created_at, -created_at); unknown ones are rejected with 400
        invalid_query_parameter.
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          description: >-
            Allowed filters: filter[code] (exact), filter[active]
            (boolean validity-window check).
          schema:
            type: object
            properties:
              code:
                type: string
              active:
                type: string
            additionalProperties:
              type: string
        - name: sort
          in: query
          required: false
          description: 'Allowed sorts: created_at, -created_at.'
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of promo codes.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodePage'
        '400':
          description: >-
            A filter or sort parameter outside the endpoint allowlist
            (code invalid_query_parameter).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidQueryParameterProblem'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            No membership in the asserted tenant, missing
            promo_codes.manage, or unconfirmed mandated MFA.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StaffCapabilityForbiddenProblem'
    post:
      operationId: createPromoCode
      summary: Create a promo code
      description: >-
        Tenant admin surface behind promo_codes.manage, audited
        (stage-07 plan, Endpoints). discount_value is basis points for
        percentage codes and minor units for fixed_amount codes, whose
        currency is then required. (tenant_id, code) is unique; a
        duplicate surfaces as request.validation_failed.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPromoCodeRequest'
      responses:
        '201':
          description: The created promo code.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCode'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            No membership in the asserted tenant, missing
            promo_codes.manage, or unconfirmed mandated MFA.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StaffCapabilityForbiddenProblem'
        '422':
          description: >-
            Request validation failed, including a duplicate code in the
            tenant or a currency that contradicts the discount type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/promo-codes/{promo_code}:
    parameters:
      - name: promo_code
