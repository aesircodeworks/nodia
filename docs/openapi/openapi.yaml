        url:
          type: [string, 'null']
        label:
          type: string
        page:
          type: [integer, 'null']
        active:
          type: boolean
      additionalProperties: false
    PageMeta:
      type: object
      required:
        - current_page
        - first_page_url
        - from
        - last_page
        - last_page_url
        - next_page_url
        - path
        - per_page
        - prev_page_url
        - to
        - total
      properties:
        current_page:
          type: integer
        first_page_url:
          type: string
        from:
          type: [integer, 'null']
        last_page:
          type: integer
        last_page_url:
          type: string
        next_page_url:
          type: [string, 'null']
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: [string, 'null']
        to:
          type: [integer, 'null']
        total:
          type: integer
      additionalProperties: false
    TenantDomain:
      type: object
      required:
        - id
        - tenant_id
        - domain
        - is_primary
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        domain:
          type: string
          description: Always the lowercase form; input is normalized before storage.
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    TenantDomainRegisterRequest:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
          description: Hostname; mixed case is accepted and normalized to lowercase.
        is_primary:
          type: boolean
      additionalProperties: false
    TenantDomainUpdateRequest:
      type: object
      properties:
        is_primary:
          type: boolean
          enum: [true]
          description: >-
