        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    Seat:
      type: object
      description: >-
        A single seat on a SeatMap template (stage-05b plan, Data model).
        position_x and position_y are integer layout grid units, never
        floats.
      required:
        - id
        - section
        - row
        - number
        - position_x
        - position_y
      properties:
        id:
          type: string
          format: uuid
        section:
          type: string
        row:
          type: string
        number:
          type: string
        position_x:
          type: [integer, 'null']
        position_y:
          type: [integer, 'null']
      additionalProperties: false
    SeatInput:
      type: object
      description: >-
        A seat in an UpsertSeatMap request body (stage-05b plan,
