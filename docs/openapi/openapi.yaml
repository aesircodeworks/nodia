        A single seat on a SeatMap template (stage-05b plan, Data model).
        position_x and position_y are integer layout grid units, never
        floats.
      required:
        - id
        - section
        - row
        - number
        - position_x
        - position_y
      properties:
        id:
          type: string
          format: uuid
