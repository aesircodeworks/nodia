          type: string
          format: uuid
    get:
      operationId: getStorefrontOrderPaymentMethods
      summary: List the payment methods offered for a pending order
      description: >-
        Storefront surface, customer bearer token required (stage-08a
        plan, Endpoints). The union of methods from the tenant's enabled
        gateways whose capability flags cover the order currency
        (system-design 7.2), minus methods excluded by the event's
        slow-method policy or the automatic low-inventory cutoff
        (system-design 7.4), minus methods of gateways with an open
        circuit breaker (system-design 13).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The offered methods; possibly empty.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodOfferList'
        '401':
          description: Missing or invalid customer bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '404':
          description: >-
            Missing, other tenant (via RLS), or other customer (code
            request.not_found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: The order is not pending.
