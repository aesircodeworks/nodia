  /v1/check-ins:
    post:
      operationId: recordCheckInScan
      summary: Record an online ticket scan
      description: >-
        Tenant admin surface (stage-09 plan, Endpoints "POST
        /v1/check-ins", Slice 4). Verifies the QR payload through
        Orders' VerifyCheckInQr Action, then authorizes through
        checkin.scan plus an assignment row for the event named inside
        the verified payload, or checkin.manage as a bypass, evaluated
        by the CheckIn context's own CheckEventAssignment Action.
        First-scan-wins is structural: the accepted insert is guarded by
        a partial unique index, never a read-then-write check. A losing
        scan still persists as a duplicate row with its own
        DuplicateScanDetected event; the 409 response is a UI signal, not
        a refusal to record. A replay of the same (device_id,
        client_scan_id) pair returns 200 with the originally recorded
        result and records nothing new.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordScanRequest'
      responses:
        '200':
          description: Replay of a previously recorded (device_id, client_scan_id) pair.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
        '201':
          description: A fresh scan was recorded.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            The caller holds neither checkin.scan nor checkin.manage, or
            holds checkin.scan with no check-in assignment for the event
            named inside the verified QR payload (code
            checkin_not_assigned in both cases).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CheckinNotAssignedProblem'
        '404':
          description: >-
            The verified QR payload names a ticket that does not exist
            for the acting tenant (code ticket_not_found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CheckInTicketNotFoundProblem'
        '409':
          description: >-
            The ticket already has an accepted check-in (code
            ticket_already_checked_in, extension members
            first_scanned_at and first_device_id; the duplicate scan is
            still persisted), or the scanned ticket's status is canceled
            (code ticket_canceled) or refunded (code ticket_refunded).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CheckInConflictProblem'
        '422':
          description: >-
            No non-revoked signing key verifies the payload's signature
            (code qr_signature_invalid), the payload verifies only
            against a revoked key (code qr_key_revoked), the embedded
            rotation counter is stale (code ticket_rotation_stale),
            scanned_at is beyond the tolerated clock skew (code
            scanned_at_in_future), or the request body fails validation
            (code request.validation_failed).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CheckInUnprocessableProblem'
  /v1/storefront/events:
    get:
      operationId: listStorefrontEvents
      summary: List a tenant's published events
      description: >-
        Storefront surface: unauthenticated, tenant resolved from the Host
        header against tenant_domains (system-design 4.1). Returns only the
        published events of the resolved tenant, ordered by start_at
        ascending; drafts and canceled events are never visible. name and
        description are resolved to single strings in the negotiated locale
        (explicit locale query parameter, then Accept-Language, then the
        tenant default; only tenant-supported locales are honored, and a
        missing translation falls back to the tenant default) and the
        response carries a Content-Language header. When q is present
        (stage-05c plan, Endpoints "Storefront search"), the response is
        instead ranked by relevance against the negotiated locale's search
        documents (PostgreSQL full-text search, ts_rank_cd, tie-broken on
        start_at ascending then id ascending for deterministic ordering);
        draft, canceled, and any other tenant's events are never returned
        even if a stale search document exists for them.
      parameters:
        - name: locale
          in: query
          required: false
          description: Preferred locale; honored only when the tenant supports it.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: >-
            Full-text search query against the negotiated locale's search
            documents. 2 to 200 characters; omit for the plain published
            list, unchanged from stage 5a.
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of published events for the resolved tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontEventPage'
        '422':
          description: >-
            q is present but shorter than 2 or longer than 200 characters
            (code request.validation_failed, with the errors map).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
