        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            No membership in the asserted tenant, missing orders.view,
            or unconfirmed mandated MFA.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StaffCapabilityForbiddenProblem'
        '404':
          description: >-
            Missing or other tenant via RLS (code order_not_found).
