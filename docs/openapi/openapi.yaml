            type: object
            properties:
              user_id:
                type: string
              role_id:
                type: string
            additionalProperties:
              type: string
        - name: sort
          in: query
          required: false
          description: 'Allowed sorts: created_at, -created_at.'
          schema:
            type: string
        - name: page
