    AsyncPaymentPolicy:
      type: object
      description: >-
        Minimal per-event shape Stage 8a reads to decide whether
        slow-confirming payment methods stay offered as an event's
        remaining inventory runs low (stage-05a plan, Data model).
        Evolution is additive only.
      properties:
        slow_methods_enabled:
          type: boolean
          default: true
        low_inventory_cutoff:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    Event:
      type: object
      description: >-
        The publishable catalog entity (stage-05a plan, Data model). name
        and description carry the full locale-keyed map (the editing
        surface); venue is present only when include=venue was requested,
        null when the event has no venue; ticket_types is present only when
        include=ticket_types was requested.
      required:
        - id
        - tenant_id
        - venue_id
        - status
        - name
        - description
        - start_at
        - end_at
        - timezone
        - is_virtual
        - virtual_event_url
        - async_payment_policy
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        venue_id:
          type: [string, 'null']
          format: uuid
        venue:
          oneOf:
            - $ref: '#/components/schemas/Venue'
            - type: 'null'
          description: Present only when include=venue is requested.
        status:
          type: string
          enum: [draft, published, canceled]
        name:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: Locale-keyed translations.
        description:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
          description: IANA timezone identifier.
        is_virtual:
          type: boolean
        virtual_event_url:
          type: [string, 'null']
          format: uri
        async_payment_policy:
          $ref: '#/components/schemas/AsyncPaymentPolicy'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/TicketType'
          description: Present only when include=ticket_types is requested.
      additionalProperties: false
    EventCreateRequest:
      type: object
      required:
        - name
        - description
        - venue_id
        - is_virtual
        - virtual_event_url
        - start_at
        - end_at
        - timezone
      properties:
        name:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        description:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        venue_id:
          type: [string, 'null']
          format: uuid
        is_virtual:
          type: boolean
        virtual_event_url:
          type: [string, 'null']
          format: uri
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
        async_payment_policy:
          $ref: '#/components/schemas/AsyncPaymentPolicy'
      additionalProperties: false
    EventUpdateRequest:
      type: object
      properties:
