        natural key: changing it on a later PUT deletes the old seat and
        inserts a new one under a new id.
      required:
        - section
        - row
        - number
        - position_x
        - position_y
      properties:
        section:
          type: string
          maxLength: 255
        row:
          type: string
          maxLength: 255
        number:
          type: string
          maxLength: 255
        position_x:
          type: [integer, 'null']
        position_y:
          type: [integer, 'null']
      additionalProperties: false
    SeatMap:
      type: object
      description: >-
        A reusable venue seating template with its full seat list
        (stage-05b plan, Data model). layout is opaque map-level geometry,
        never interpreted by the API.
      required:
        - id
        - tenant_id
        - venue_id
        - name
        - layout
        - seats
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        name:
          type: string
        layout:
          type: object
