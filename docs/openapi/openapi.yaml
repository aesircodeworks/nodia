openapi: 3.1.0
info:
  title: Nodia API
  description: >-
    Repository OpenAPI specification per docs/api-conventions.md. Each
    feature's contract fragment (specs/*/contracts/) is merged here as its
    endpoints ship. Response shapes are generated from laravel-data objects;
    this document mirrors them and must not drift from them.
  version: 0.1.0
paths:
  /v1/tenants:
    post:
      operationId: createTenant
      summary: Create a tenant
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability, evaluated against the acting membership under the
        sentinel platform tenant (stage-03 plan, task breakdown item 7,
        closing the Stage 2 placeholder auth alias deferral).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed, with
            the errors map) or the default locale is not one of the supported
            locales (code default_locale_not_supported).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantUnprocessableProblem'
    get:
      operationId: listTenants
      summary: List tenants
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). Page pagination with the standard
        Laravel paginator envelope. Allowed query-builder parameters are
        filter[name] and sort in (name, created_at, -name, -created_at);
        unknown filters or sorts are rejected with 400
        invalid_query_parameter, never ignored. The parameter schemas below
        stay loose on purpose: the allowlist is enforced by the API, not by
        request-shape validation.
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          description: 'Allowed filters: filter[name] (partial match).'
          schema:
            type: object
            properties:
              name:
                type: string
            additionalProperties:
              type: string
        - name: sort
          in: query
          required: false
          description: 'Allowed sorts: name, created_at, -name, -created_at.'
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of tenants.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
        '400':
          description: Unknown filter or sort parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidQueryParameterProblem'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
  /v1/tenants/{tenant}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTenant
      summary: Fetch one tenant
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantNotFoundProblem'
    patch:
      operationId: updateTenant
      summary: Update a tenant
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). All fields are optional; absent
        fields are left untouched. Branding and locale fields route to the
        UpdateBranding action, gateway fields to ConfigureGateways.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: The updated tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantNotFoundProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed, with
            the errors map) or the effective default locale would fall
            outside the effective supported locales (code
            default_locale_not_supported).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantUnprocessableProblem'
  /v1/tenants/{tenant}/domains:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: registerTenantDomain
      summary: Register a domain for a tenant
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). The domain is normalized to
        lowercase before it is stored, so the response always carries the
        lowercase form. A domain resolves to exactly one tenant
        platform-wide.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantDomainRegisterRequest'
      responses:
        '201':
          description: Domain registered.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDomain'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantNotFoundProblem'
        '409':
          description: >-
            The domain is already registered to a tenant (code
            domain_already_registered), or is_primary was requested and the
            tenant already has a primary domain (code
            tenant_domain_is_primary; promote through the tenant-domains
            PATCH instead).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantDomainConflictProblem'
        '422':
          description: Request validation failed, including malformed hostnames.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
    get:
      operationId: listTenantDomains
      summary: List a tenant's domains
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). Page pagination with the standard
        Laravel paginator envelope, sorted by domain; no query-builder
        parameters.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of the tenant's domains.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDomainPage'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantNotFoundProblem'
  /v1/tenant-domains/{tenant_domain}:
    parameters:
      - name: tenant_domain
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTenantDomain
      summary: Make a domain the tenant's primary domain
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). Item operations live at this
        top-level resource because nesting under /v1/tenants/{tenant}/domains
        would exceed the one-level nesting rule. is_primary only accepts
        true; a domain is demoted by promoting another domain, so a demotion
        request is rejected as unprocessable. The promotion is idempotent:
        replaying it returns the current state without writing.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantDomainUpdateRequest'
      responses:
        '200':
          description: The domain, primary after promotion.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDomain'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant domain has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantDomainNotFoundProblem'
        '422':
          description: Request validation failed, including is_primary false.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
    delete:
      operationId: removeTenantDomain
      summary: Remove a domain
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). The tenant's primary domain
        cannot be removed; promote another domain first.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Domain removed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant domain has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantDomainNotFoundProblem'
        '409':
          description: The domain is the tenant's primary domain; demote it first.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantDomainIsPrimaryProblem'
  /v1/auth/staff/token:
    post:
      operationId: issueStaffToken
      summary: Exchange staff credentials for a token pair
      description: >-
        Unauthenticated. Drives Passport's password grant directly rather
        than Passport's own /oauth/token route (docs/decisions/011). An
        unknown email and a correct email with the wrong password both fail
        with the same invalid_credentials code, so the response never
        reveals whether an account exists. The access token is a JWT
        carrying identity_type staff and the subject id; it carries no
        tenant claim, because the acting tenant is asserted per request via
        X-Tenant-Id (docs/api-conventions.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffTokenRequest'
      responses:
        '200':
          description: A new access and refresh token pair.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: >-
            The email is unknown or the password is wrong (code
            invalid_credentials); both cases render identically.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidCredentialsProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/staff/refresh:
    post:
      operationId: refreshStaffToken
      summary: Rotate a staff refresh token for a new token pair
      description: >-
        Unauthenticated (the refresh token itself is the credential).
        Rotation is single-use: the presented refresh token is revoked in
        the same request that issues its replacement, guarded by a
        conditional UPDATE checked by affected-row count so two concurrent
        rotations of the same token succeed exactly once (docs/decisions/011,
        stage-03 plan Slice 2). Presenting an already-rotated refresh token
        is treated as reuse: it revokes every live token issued from the
        same original login (code refresh_token_reused). An expired,
        malformed, or unknown refresh token fails with
        invalid_refresh_token, as does the loser of a concurrent rotation
        race.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: A new access and refresh token pair.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: >-
            The refresh token is expired, malformed, or unknown (code
            invalid_refresh_token), or it was already rotated away from
            and is being presented again (code refresh_token_reused),
            which also revokes every live token issued from its login.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RefreshTokenProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/staff/logout:
    post:
      operationId: logoutStaff
      summary: Revoke the current staff session
      description: >-
        Staff bearer only. Revokes the presented access token and its live
        refresh token; other sessions for the same user are unaffected
        (stage-03 plan, Slice 2).
      security:
        - BearerAuth: []
      responses:
        '204':
          description: The session's access and refresh token are revoked.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Fetch the authenticated staff user
      description: >-
        Staff bearer only; asserts no tenant. memberships lists every one
        of the caller's own membership rows across every tenant, resolved
        through the memberships_self_read RLS policy with app.user_id set
        by the auth layer.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The authenticated staff user.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
  /v1/internal/domain-verification:
    get:
      operationId: verifyDomain
      summary: Confirm a domain is registered (Caddy on-demand TLS ask)
      description: >-
        Network-internal endpoint consumed by the edge proxy's on-demand TLS
        ask during the handshake; infrastructure must never route it through
        the public edge. Unauthenticated by design. Existence of the
        normalized (lowercased) domain in tenant_domains is the gate, so
        matching is case-insensitive. The parameter schema stays loose on
        purpose: hostname validity is enforced by the API, which rejects a
        malformed value as unprocessable.
      parameters:
        - name: domain
          in: query
          required: true
          description: Hostname to verify; mixed case is accepted.
          schema:
            type: string
      responses:
        '204':
          description: The domain is registered to a tenant; issue the certificate.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '404':
          description: No tenant has this domain registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnknownDomainProblem'
        '422':
          description: >-
            The domain parameter is missing or is not a well-formed
            hostname.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/health:
    get:
      operationId: getHealth
      summary: Report API health and backing service connectivity
      description: >-
        Unauthenticated. Returns 200 when all backing services are reachable,
        503 as an RFC 9457 problem document when any check fails. Every
        response echoes the X-Correlation-Id header per
        docs/api-conventions.md.
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Correlation ID; generated by the server when absent.
      responses:
        '200':
          description: All backing services reachable.
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
              examples:
                healthy:
                  value:
                    status: ok
                    checks:
                      database: ok
                      redis: ok
                      storage: ok
                    checked_at: '2026-07-04T12:00:00Z'
        '503':
          description: >-
            At least one backing service check failed. RFC 9457 problem
            document per docs/api-conventions.md, with the health checks
            carried as extension members.
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HealthDegradedProblem'
              examples:
                degraded:
                  value:
                    type: '/problems/health-degraded'
                    title: 'Service degraded'
                    status: 503
                    detail: 'One or more backing services failed their health check.'
                    code: 'health.degraded'
                    checks:
                      database: ok
                      redis: failed
                      storage: ok
                    checked_at: '2026-07-04T12:00:00Z'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Passport-issued JWT access token (docs/decisions/011). Carries
        identity_type and, for customers only, tenant_id.
  headers:
    XCorrelationId:
      description: Echo of the request correlation ID per docs/api-conventions.md.
      schema:
        type: string
        format: uuid
  schemas:
    StaffTokenRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      additionalProperties: false
    TokenPair:
      type: object
      description: >-
        OAuth 2.0 bearer token pair issued by Passport's password grant
        (docs/decisions/011).
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: Short-lived JWT; see BearerAuth for its claims.
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
      additionalProperties: false
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
      additionalProperties: false
    Membership:
      type: object
      description: >-
        One row of CurrentUser.memberships: the caller's own membership in
        one tenant (scope tenant) or their platform-scope administrator
        membership (scope platform, tenant_id the sentinel platform
        tenant).
      required:
        - id
        - user_id
        - user_name
        - user_email
        - tenant_id
        - role_id
        - role_name
        - scope
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        user_email:
          type: string
          format: email
        tenant_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        role_name:
          type: string
        scope:
          type: string
          enum: [tenant, platform]
      additionalProperties: false
    CurrentUser:
      type: object
      required:
        - id
        - name
        - email
        - mfa_enabled
        - memberships
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        mfa_enabled:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      additionalProperties: false
    BrandingSettings:
      type: object
      description: >-
        Tenant branding configuration. JSON configuration only in this stage;
        the logo becomes a media upload when media infrastructure lands.
      properties:
        primary_color:
          type: [string, 'null']
        logo_url:
          type: [string, 'null']
      additionalProperties: false
    Tenant:
      type: object
      required:
        - id
        - name
        - branding_settings
        - default_locale
        - supported_locales
        - enabled_gateways
        - payout_schedule
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        branding_settings:
          $ref: '#/components/schemas/BrandingSettings'
        default_locale:
          type: string
        supported_locales:
          type: array
          items:
            type: string
        enabled_gateways:
          type: array
          items:
            type: string
        payout_schedule:
          type: [object, 'null']
          description: >-
            Opaque configuration until the payouts stage defines and
            validates its schema.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    TenantCreateRequest:
      type: object
      required:
        - name
        - default_locale
        - supported_locales
      properties:
        name:
          type: string
        default_locale:
          type: string
        supported_locales:
          type: array
          items:
            type: string
        branding_settings:
          $ref: '#/components/schemas/BrandingSettings'
        enabled_gateways:
          type: array
          items:
            type: string
        payout_schedule:
          type: [object, 'null']
      additionalProperties: false
    TenantUpdateRequest:
      type: object
      properties:
        name:
          type: string
        branding_settings:
          $ref: '#/components/schemas/BrandingSettings'
        default_locale:
          type: string
        supported_locales:
          type: array
          items:
            type: string
        enabled_gateways:
          type: array
          items:
            type: string
        payout_schedule:
          type: [object, 'null']
      additionalProperties: false
    TenantPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    PageLink:
      type: object
      required:
        - url
        - label
        - page
        - active
      properties:
        url:
          type: [string, 'null']
        label:
          type: string
        page:
          type: [integer, 'null']
        active:
          type: boolean
      additionalProperties: false
    PageMeta:
      type: object
      required:
        - current_page
        - first_page_url
        - from
        - last_page
        - last_page_url
        - next_page_url
        - path
        - per_page
        - prev_page_url
        - to
        - total
      properties:
        current_page:
          type: integer
        first_page_url:
          type: string
        from:
          type: [integer, 'null']
        last_page:
          type: integer
        last_page_url:
          type: string
        next_page_url:
          type: [string, 'null']
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: [string, 'null']
        to:
          type: [integer, 'null']
        total:
          type: integer
      additionalProperties: false
    TenantDomain:
      type: object
      required:
        - id
        - tenant_id
        - domain
        - is_primary
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        domain:
          type: string
          description: Always the lowercase form; input is normalized before storage.
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    TenantDomainRegisterRequest:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
          description: Hostname; mixed case is accepted and normalized to lowercase.
        is_primary:
          type: boolean
      additionalProperties: false
    TenantDomainUpdateRequest:
      type: object
      properties:
        is_primary:
          type: boolean
          enum: [true]
          description: >-
            Only true is accepted; a domain is demoted by promoting another
            domain of the same tenant.
      additionalProperties: false
    TenantDomainPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TenantDomain'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    TenantDomainNotFoundProblem:
      description: Problem document for a tenant domain id that references no domain.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [tenant_domain_not_found]
      unevaluatedProperties: false
    TenantDomainConflictProblem:
      description: >-
        Problem document for a domain registration that conflicts with
        existing rows: the domain is already registered platform-wide, or
        the tenant already has a primary domain.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [domain_already_registered, tenant_domain_is_primary]
      unevaluatedProperties: false
    TenantDomainIsPrimaryProblem:
      description: >-
        Problem document for an operation refused because the domain is the
        tenant's primary domain; promote another domain first.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [tenant_domain_is_primary]
      unevaluatedProperties: false
    UnknownDomainProblem:
      description: >-
        Problem document for a well-formed domain that is not registered to
        any tenant; the edge proxy must refuse to issue a certificate.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [unknown_domain]
      unevaluatedProperties: false
    TenantNotFoundProblem:
      description: Problem document for a tenant id that references no tenant.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [tenant_not_found]
      unevaluatedProperties: false
    InvalidCredentialsProblem:
      description: >-
        Problem document for a staff token request with an unknown email or
        a wrong password; both cases render identically so the response
        never reveals whether an account exists.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [invalid_credentials]
      unevaluatedProperties: false
    RefreshTokenProblem:
      description: >-
        Problem document for a rejected refresh token: it is expired,
        malformed, or unknown (code invalid_refresh_token, also used for
        the loser of a concurrent rotation race), or it was already
        rotated away from and is being presented again (code
        refresh_token_reused), which also revokes every live token issued
        from its login.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [invalid_refresh_token, refresh_token_reused]
      unevaluatedProperties: false
    UnauthenticatedProblem:
      description: >-
        Problem document for a request with a missing, invalid, or expired
        bearer token.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [auth.unauthenticated]
      unevaluatedProperties: false
    MissingCapabilityProblem:
      description: >-
        Problem document for an authenticated caller whose acting
        membership's role does not hold the capability the endpoint
        requires, evaluated as capability plus tenant context, never role
        names (system-design 5.3, ADR 012).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [missing_capability]
      unevaluatedProperties: false
    InvalidQueryParameterProblem:
      description: >-
        Problem document for an unknown filter or sort parameter on an
        allowlisted list endpoint; unknown parameters are rejected, never
        ignored.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [400]
            code:
              type: string
              enum: [invalid_query_parameter]
      unevaluatedProperties: false
    TenantUnprocessableProblem:
      description: >-
        Problem document for a tenant write that cannot be processed: either
        request validation failed (with the errors map) or the default
        locale falls outside the supported locales.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [default_locale_not_supported]
      unevaluatedProperties: false
    Money:
      type: object
      description: >-
        Monetary value per docs/api-conventions.md: integer minor units paired
        with an uppercase ISO 4217 currency code. Amounts never appear on the
        wire without a currency, and never as floats.
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          description: >-
            Amount in the currency's minor units (e.g. centavos). May be
            negative (refunds, corrections).
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Uppercase ISO 4217 currency code.
      additionalProperties: false
    HealthReport:
      type: object
      required:
        - status
        - checks
        - checked_at
      properties:
        status:
          type: string
          enum: [ok]
          description: >-
            Always ok on a 200 response; degraded states are returned as the
            503 problem document.
        checks:
          $ref: '#/components/schemas/HealthChecks'
        checked_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of check execution.
      additionalProperties: false
    Problem:
      type: object
      description: >-
        RFC 9457 problem document shared by every error response under /v1
        per docs/api-conventions.md. Specific problems extend it with
        extension members.
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            Stable problem type URI reference, /problems/{slug} with the slug
            derived mechanically from code (dots and underscores become
            dashes).
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code of the response.
        detail:
          type: string
          description: >-
            Human-readable occurrence detail. Never stable contract; clients
            branch on code instead.
        code:
          type: string
          description: Stable machine-readable code; clients branch on this.
        correlation_id:
          type: string
          description: >-
            Echo of the request correlation ID also carried in the
            X-Correlation-Id response header.
    ValidationProblem:
      description: >-
        Problem document for failed request validation, extended with the
        errors map of field name to messages.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            status:
              type: integer
              enum: [422]
            code:
              type: string
              enum: [request.validation_failed]
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: Map of field name to validation messages.
      unevaluatedProperties: false
    HealthDegradedProblem:
      description: >-
        Problem document for the degraded health report, extended with the
        health checks. Frozen contract; the correlation ID travels only in
        the X-Correlation-Id header on this response.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - checks
            - checked_at
          properties:
            status:
              type: integer
              enum: [503]
            code:
              type: string
              enum: [health.degraded]
            checks:
              $ref: '#/components/schemas/HealthChecks'
            checked_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp of check execution.
      unevaluatedProperties: false
    HealthChecks:
      type: object
      required:
        - database
        - redis
        - storage
      properties:
        database:
          $ref: '#/components/schemas/CheckResult'
        redis:
          $ref: '#/components/schemas/CheckResult'
        storage:
          $ref: '#/components/schemas/CheckResult'
      additionalProperties: false
    CheckResult:
      type: string
      enum: [ok, failed]
