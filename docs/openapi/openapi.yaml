        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    TenantCreateRequest:
      type: object
      required:
        - name
        - default_locale
        - supported_locales
      properties:
        name:
          type: string
        default_locale:
          type: string
        supported_locales:
          type: array
          items:
            type: string
        branding_settings:
          $ref: '#/components/schemas/BrandingSettings'
        enabled_gateways:
          type: array
          items:
            type: string
        payout_schedule:
          type: [object, 'null']
      additionalProperties: false
    TenantUpdateRequest:
      type: object
      properties:
        name:
          type: string
        branding_settings:
          $ref: '#/components/schemas/BrandingSettings'
        default_locale:
          type: string
        supported_locales:
          type: array
          items:
            type: string
        enabled_gateways:
          type: array
          items:
            type: string
        payout_schedule:
          type: [object, 'null']
      additionalProperties: false
    TenantPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
