        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    AsyncPaymentPolicy:
      type: object
      description: >-
        Minimal per-event shape Stage 8a reads to decide whether
        slow-confirming payment methods stay offered as an event's
        remaining inventory runs low (stage-05a plan, Data model).
        Evolution is additive only.
      properties:
        slow_methods_enabled:
          type: boolean
          default: true
        low_inventory_cutoff:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    Event:
      type: object
      description: >-
        The publishable catalog entity (stage-05a plan, Data model). name
        and description carry the full locale-keyed map (the editing
        surface); venue is present only when include=venue was requested,
        null when the event has no venue; ticket_types is present only when
        include=ticket_types was requested. seat_map_id (stage-05b plan,
        Endpoints: "the map id appears in the event admin read shape") is
        always present, unlike venue and ticket_types: it is a scalar
        column, not a relation gated behind an include.
      required:
        - id
        - tenant_id
        - venue_id
        - seat_map_id
        - status
        - name
        - description
        - start_at
        - end_at
        - timezone
        - is_virtual
        - virtual_event_url
        - async_payment_policy
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        venue_id:
          type: [string, 'null']
          format: uuid
        seat_map_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The seating template this event was built from, set via PATCH
            /v1/events/{event} (stage-05b plan). Null until an event opts
            into a template.
        venue:
          oneOf:
            - $ref: '#/components/schemas/Venue'
            - type: 'null'
          description: Present only when include=venue is requested.
        status:
          type: string
          enum: [draft, published, canceled]
        name:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: Locale-keyed translations.
        description:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
          description: IANA timezone identifier.
        is_virtual:
          type: boolean
        virtual_event_url:
          type: [string, 'null']
          format: uri
        async_payment_policy:
          $ref: '#/components/schemas/AsyncPaymentPolicy'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/TicketType'
          description: Present only when include=ticket_types is requested.
      additionalProperties: false
    EventCreateRequest:
      type: object
      required:
        - name
        - description
        - venue_id
        - is_virtual
        - virtual_event_url
        - start_at
        - end_at
        - timezone
      properties:
        name:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        description:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        venue_id:
          type: [string, 'null']
          format: uuid
        is_virtual:
          type: boolean
        virtual_event_url:
          type: [string, 'null']
          format: uri
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
        async_payment_policy:
          $ref: '#/components/schemas/AsyncPaymentPolicy'
      additionalProperties: false
    EventUpdateRequest:
      type: object
      properties:
        name:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        description:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        venue_id:
          type: [string, 'null']
          format: uuid
        is_virtual:
          type: boolean
        virtual_event_url:
          type: [string, 'null']
          format: uri
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
        async_payment_policy:
          $ref: '#/components/schemas/AsyncPaymentPolicy'
        seat_map_id:
          type: [string, 'null']
          format: uuid
          description: >-
            Set to a seat map id belonging to the event's venue, or null to
            clear the link (stage-05b plan, Endpoints). Changing venue_id
            or flipping is_virtual while seat_map_id remains set (given or
            already stored) is rejected unless the same request clears it.
      additionalProperties: false
    EventPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    TicketType:
      type: object
      description: >-
        A purchasable line item on an event (stage-05a plan, Data model).
        price is Money on the wire; price_amount never appears bare
        (ADR 018). requires_seat ships now as a stable column Stage 6
        reads; nothing here references seats or availability yet.
      required:
        - id
        - tenant_id
        - event_id
        - name
        - price
        - sales_start
        - sales_end
        - requires_seat
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        sales_start:
          type: [string, 'null']
          format: date-time
        sales_end:
          type: [string, 'null']
          format: date-time
        requires_seat:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    TicketTypeInventory:
      type: object
      description: >-
        GET /v1/ticket-types/{ticket_type}/inventory response shape
        (stage-06 plan, Endpoints): the raw ticket_type_inventory counter
        row for one ticket type.
      required:
        - quantity
        - sold
        - held
      properties:
        quantity:
          type: integer
        sold:
          type: integer
        held:
          type: integer
      additionalProperties: false
    HoldItem:
      type: object
      description: One GA line item of a hold (stage-06 plan, Endpoints).
      required:
        - ticket_type_id
        - quantity
      properties:
        ticket_type_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
      additionalProperties: false
    HoldItemInput:
      type: object
      description: >-
        One line item of a CreateHoldRequest (stage-06 plan, Endpoints).
        Seat selection for a requires_seat item is not carried here: it
        is CreateHoldRequest's own top-level seat_ids, partitioned
        positionally across the requires_seat items in request order.
      required:
        - ticket_type_id
        - quantity
      properties:
        ticket_type_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
      additionalProperties: false
    Hold:
      type: object
      description: >-
        POST and GET /v1/storefront/holds/{hold} response shape (stage-06
        plan, Endpoints). seat_ids is the full set of seats currently held
        (or, once committed, sold) for this hold; empty for a GA-only
        hold.
      required:
        - id
        - event_id
        - status
        - expires_at
        - items
        - seat_ids
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, released, expired, committed]
        expires_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/HoldItem'
        seat_ids:
          type: array
          items:
            type: string
            format: uuid
      additionalProperties: false
    CreateOrderRequest:
      type: object
      description: >-
        POST /v1/storefront/orders request body (stage-07 plan,
        Endpoints). The authenticated customer comes from the bearer
        token, never the body. attendee_names is keyed by ticket type
        id. Slice 5 adds the optional promo_code field.
      required:
        - hold_id
      properties:
        hold_id:
          type: string
          format: uuid
        attendee_names:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        promo_code:
          type: string
      additionalProperties: false
    OrderCreateUnprocessableProblem:
      description: >-
        Problem document for POST /v1/storefront/orders that cannot be
        processed: request validation failed (with the errors map, code
        request.validation_failed) or the promo_code was rejected
        (stage-07 plan, Error codes).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - promo_code_invalid
                    - promo_code_not_active
                    - promo_code_exhausted
                    - promo_code_currency_mismatch
      unevaluatedProperties: false
    PromoCode:
      type: object
      description: >-
        The staff promo code wire shape (stage-07 plan, Endpoints).
        discount_value is basis points for percentage codes and minor
        units for fixed_amount codes, whose currency is then non-null.
      required:
        - id
        - code
        - discount_type
        - discount_value
        - currency
        - usage_limit
        - usage_count
        - valid_from
        - valid_to
        - created_at
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        discount_type:
          type: string
          enum: [percentage, fixed_amount]
        discount_value:
          type: integer
          minimum: 1
        currency:
          type: string
          nullable: true
        usage_limit:
          type: integer
          nullable: true
        usage_count:
          type: integer
        valid_from:
          type: string
          format: date-time
          nullable: true
        valid_to:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    PromoCodePage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PromoCode'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    UpsertPromoCodeRequest:
      type: object
      description: >-
        POST and PATCH /v1/promo-codes request body (stage-07 plan,
        Endpoints). Every field is optional so PATCH stays partial; POST
        requires code, discount_type, and discount_value.
      properties:
        code:
          type: string
        discount_type:
          type: string
          enum: [percentage, fixed_amount]
        discount_value:
          type: integer
          minimum: 1
        currency:
          type: string
          nullable: true
        usage_limit:
          type: integer
          nullable: true
        valid_from:
          type: string
          format: date-time
          nullable: true
        valid_to:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    PromoCodeUpdateUnprocessableProblem:
      description: >-
        Problem document for PATCH /v1/promo-codes/{promo_code} that
        cannot be processed: request validation failed (with the errors
        map) or a locked field changed after first use (stage-07 plan,
        Error codes).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [promo_code_immutable_field]
      unevaluatedProperties: false
    SigningKey:
      type: object
      description: >-
        The staff signing-key wire shape (stage-09 plan, Endpoints
        "GET/POST /v1/events/{event}/signing-keys"). secret is
        base64-encoded opaque binary key material and crosses the wire
        only here, TLS everywhere assumed.
      required:
        - id
        - key_version
        - secret
        - status
        - activated_at
        - retired_at
      properties:
        id:
          type: string
          format: uuid
        key_version:
          type: integer
          minimum: 1
        secret:
          type: string
          format: byte
        status:
          type: string
          enum: [active, retired, revoked]
        activated_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    SigningKeyList:
      type: object
      description: >-
        Unpaginated bounded collection envelope for GET
        /v1/events/{event}/signing-keys (stage-09 plan, Endpoints): no
        pagination metadata to carry, mirroring CapabilityList's own
        posture.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SigningKey'
      additionalProperties: false
    RotateSigningKeyRequest:
      type: object
      description: >-
        POST /v1/events/{event}/signing-keys request body (stage-09
        plan, Endpoints). revoke_previous defaults to false.
      properties:
        revoke_previous:
          type: boolean
          default: false
      additionalProperties: false
    CheckinNotAssignedProblem:
      description: >-
        Problem document for a 403 on a check-in-scoped staff endpoint
        (stage-09 plan, Authorization semantics paragraph): the caller
        holds neither checkin.scan nor checkin.manage, or holds
        checkin.scan with no check-in assignment row for the target
        event. Both denial reasons render the same code.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [checkin_not_assigned]
      unevaluatedProperties: false
    SigningKeyEventNotFoundProblem:
      description: >-
        Problem document for GET/POST /v1/events/{event}/signing-keys
        when the given event id resolves to no visible row for the
        acting tenant (stage-09 plan, Endpoints, code event_not_found).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [event_not_found]
      unevaluatedProperties: false
    ManifestEntry:
      type: object
      description: >-
        One row of GET /v1/events/{event}/check-in-manifest's response
        (stage-09 plan, Endpoints): ticket id, status, rotation counter,
        and the accepted check-in overlay. Deliberately no attendee PII.
      required:
        - ticket_id
        - status
        - rotation_counter
        - checked_in_at
      properties:
        ticket_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [issued, canceled, refunded]
        rotation_counter:
          type: integer
          minimum: 0
        checked_in_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    ManifestCursorPage:
      type: object
      description: >-
        Cursor-paginated envelope (data, links, meta) for the check-in
        manifest (stage-09 plan, Endpoints "GET /v1/events/{event}/
        check-in-manifest"), ordered deterministically by ticket_id.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ManifestEntry'
        links:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/CursorPageMeta'
      additionalProperties: false
    ManifestEventNotFoundProblem:
      description: >-
        Problem document for GET /v1/events/{event}/check-in-manifest
        when the given event id resolves to no visible row for the
        acting tenant (stage-09 plan, Endpoints, code event_not_found).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [event_not_found]
      unevaluatedProperties: false
    RecordScanRequest:
      type: object
      description: >-
        POST /v1/check-ins request body (stage-09 plan, Endpoints "POST
        /v1/check-ins"). scanned_at is the client-attested scan instant
        (the device clock), never the server's.
      required:
        - qr_payload
        - device_id
        - client_scan_id
        - scanned_at
      properties:
        qr_payload:
          type: string
        device_id:
          type: string
        client_scan_id:
          type: string
        scanned_at:
          type: string
          format: date-time
      additionalProperties: false
    CheckInResult:
      type: object
      description: >-
        POST /v1/check-ins response body (stage-09 plan, Endpoints "POST
        /v1/check-ins"): 201 for a fresh scan, 200 for a replay of the
        same (device_id, client_scan_id) pair returning the original
        result.
      required:
        - check_in_id
        - ticket_id
        - event_id
        - result
        - scanned_at
        - synced_at
      properties:
        check_in_id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        result:
          type: string
          enum: [accepted, duplicate]
        scanned_at:
          type: string
          format: date-time
        synced_at:
          type: string
          format: date-time
      additionalProperties: false
    CheckInTicketNotFoundProblem:
      description: >-
        Problem document for POST /v1/check-ins when the verified QR
        payload names a ticket that does not exist for the acting tenant
        (stage-09 plan, Endpoints, code ticket_not_found).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [ticket_not_found]
      unevaluatedProperties: false
    CheckInConflictProblem:
      description: >-
        Problem document for POST /v1/check-ins 409 responses (stage-09
        plan, Endpoints): the ticket already has an accepted check-in
        (code ticket_already_checked_in, extension members
        first_scanned_at and first_device_id; the duplicate scan and its
        DuplicateScanDetected event have already been persisted by the
        time this renders), or the scanned ticket's status is canceled
        (code ticket_canceled) or refunded (code ticket_refunded).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - first_scanned_at
                - first_device_id
              properties:
                code:
                  type: string
                  enum: [ticket_already_checked_in]
                first_scanned_at:
                  type: string
                  format: date-time
                first_device_id:
                  type: string
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - ticket_canceled
                    - ticket_refunded
      unevaluatedProperties: false
    CheckInUnprocessableProblem:
      description: >-
        Problem document for POST /v1/check-ins 422 responses (stage-09
        plan, Endpoints): no non-revoked signing key verifies the
        payload's signature (code qr_signature_invalid), the payload
        verifies only against a revoked key (code qr_key_revoked), the
        embedded rotation counter is stale (code ticket_rotation_stale),
        scanned_at is beyond the tolerated clock skew (code
        scanned_at_in_future), or the request body fails validation
        (code request.validation_failed, with the errors map).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - qr_signature_invalid
                    - qr_key_revoked
                    - ticket_rotation_stale
                    - scanned_at_in_future
      unevaluatedProperties: false
    CheckPromoCodeRequest:
      type: object
      description: >-
        POST /v1/storefront/promo-codes/check request body (stage-07
        plan, Endpoints).
      required:
        - code
        - hold_id
      properties:
        code:
          type: string
        hold_id:
          type: string
          format: uuid
      additionalProperties: false
    PromoCodeCheck:
      type: object
      description: >-
        POST /v1/storefront/promo-codes/check response shape (stage-07
        plan, Endpoints): a read-only preview that never increments
        usage_count. discount is null and reason_code carries the stable
        error code when valid is false.
      required:
        - valid
        - discount
        - reason_code
      properties:
        valid:
          type: boolean
        discount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        reason_code:
          type: string
          nullable: true
          enum:
            - promo_code_invalid
            - promo_code_not_active
            - promo_code_exhausted
            - promo_code_currency_mismatch
            - null
      additionalProperties: false
    OrderItem:
      type: object
      description: >-
        One priced line of an order, snapshotted at conversion time
        (stage-07 plan, Data model "order_items").
      required:
        - ticket_type_id
        - quantity
        - unit_price
        - attendee_names
      properties:
        ticket_type_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Money'
        attendee_names:
          type: array
          items:
            type: string
          nullable: true
      additionalProperties: false
    Order:
      type: object
      description: >-
        The order wire shape shared by the buyer and staff read surfaces
        (stage-07 plan, Endpoints). promo_code is the human-facing code
        string, null when no code was applied; raw promo ids are never
        exposed.
      required:
        - id
        - status
        - event_id
        - items
        - subtotal
        - discount
        - fees
        - total
        - promo_code
        - created_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - awaiting_payment
            - paid
            - expired
            - failed
            - canceled
            - partially_refunded
            - refunded
        event_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        fees:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        promo_code:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    OrderHoldNotFoundProblem:
      description: >-
        Problem document for POST /v1/storefront/orders when the hold
        does not exist for this tenant or belongs to a different
        customer (stage-07 plan, Error codes: not-found semantics so
        hold ids never leak ownership).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [hold_not_found]
      unevaluatedProperties: false
    Ticket:
      type: object
      description: >-
        One ticket in the buyer's tickets response (stage-07 plan,
        Endpoints). qr_payload is computed on render over ticket id,
        event id, and the per-ticket rotation counter; it is never
        stored and stops verifying after a rotation bump.
      required:
        - id
        - ticket_type_id
        - event_seat_id
        - status
        - attendee_name
        - issued_at
        - qr_payload
      properties:
        id:
          type: string
          format: uuid
        ticket_type_id:
          type: string
          format: uuid
        event_seat_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [issued, canceled, refunded]
        attendee_name:
          type: string
          nullable: true
        issued_at:
          type: string
          format: date-time
        qr_payload:
          type: string
      additionalProperties: false
    TicketList:
      type: object
      description: >-
        The bounded, unpaginated data envelope for one order's tickets
        (docs/api-conventions.md collection shape; no top-level bare
        arrays in this spec).
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
      additionalProperties: false
    CustomerSummary:
      type: object
      description: >-
        One customer in the staff lookup list and the staff order
        detail's customer summary (stage-07 plan, Endpoints): identifiers
        and contact facts only.
      required:
        - id
        - email
        - name
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    CursorPageMeta:
      type: object
      description: >-
        laravel-data's cursor paginator meta (docs/api-conventions.md,
        high-volume collections use cursorPaginate).
      required:
        - path
        - per_page
        - next_cursor
        - next_page_url
        - prev_cursor
        - prev_page_url
      properties:
        path:
          type: string
        per_page:
          type: integer
        next_cursor:
          type: string
          nullable: true
        next_page_url:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true
        prev_page_url:
          type: string
          nullable: true
      additionalProperties: false
    CustomerSummaryCursorPage:
      type: object
      description: >-
        Cursor-paginated envelope (data, links, meta) for the staff
        customer lookup (stage-07 plan, Endpoints).
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerSummary'
        links:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/CursorPageMeta'
      additionalProperties: false
    StaffCapabilityForbiddenProblem:
      description: >-
        Problem document for a 403 on a capability-gated staff endpoint
        (stage-07 plan surfaces): no membership in the asserted tenant
        (code tenant_access_denied, raised by ResolveTenantFromHeader),
        the acting membership does not hold the required capability
        (code missing_capability), or the acting membership mandates
        confirmed MFA and has not confirmed it (code
        mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    OrderCursorPage:
      type: object
      description: >-
        Cursor-paginated envelope (data, links, meta) for the staff
        order list (stage-07 plan, Endpoints).
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        links:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/CursorPageMeta'
      additionalProperties: false
    OrderDetail:
      type: object
      description: >-
        GET /v1/orders/{order} response shape (stage-07 plan,
        Endpoints): the order fields plus tickets and a customer summary
        composed through Identity, never a join. customer is null only
        for an erased customer (anonymize-in-place, system-design 14.3).
      required:
        - id
        - status
        - event_id
        - items
        - subtotal
        - discount
        - fees
        - total
        - promo_code
        - created_at
        - tickets
        - customer
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - awaiting_payment
            - paid
            - expired
            - failed
            - canceled
            - partially_refunded
            - refunded
        event_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        fees:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        promo_code:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        customer:
          oneOf:
            - $ref: '#/components/schemas/CustomerSummary'
            - type: 'null'
      additionalProperties: false
    OrderNotPaidProblem:
      description: >-
        Problem document for POST /v1/orders/{order}/resend-tickets on
        an order without issued tickets (stage-07 plan, Error codes).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [order_not_paid]
      unevaluatedProperties: false
    OrderNotFoundProblem:
      description: >-
        Problem document for the storefront and staff order surfaces
        when the order is missing, belongs to another tenant (via RLS),
        or belongs to another customer (stage-07 plan, Error codes).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [order_not_found]
      unevaluatedProperties: false
    OrderNotCancelableProblem:
      description: >-
        Problem document for POST /v1/storefront/orders/{order}/cancel
        when the order is not pending (stage-07 plan, Error codes).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [order_not_cancelable]
      unevaluatedProperties: false
    OrderCreateConflictProblem:
      description: >-
        Problem document for POST /v1/storefront/orders when the hold
        has expired regardless of sweeper state (code
        checkout.hold_expired) or an order already references the hold
        (code hold_already_converted), stage-07 plan Error codes.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [checkout.hold_expired, hold_already_converted]
      unevaluatedProperties: false
    PaymentMethodOffer:
      type: object
      description: >-
        One offered payment method (stage-08a plan, Endpoints "GET
        /v1/storefront/orders/{order}/payment-methods").
        confirmation_window_minutes is null for synchronous methods.
      required:
        - method
        - gateway
        - confirmation
        - confirmation_window_minutes
      properties:
        method:
          type: string
        gateway:
          type: string
        confirmation:
          type: string
          enum: [sync, async]
        confirmation_window_minutes:
          oneOf:
            - type: integer
            - type: 'null'
      additionalProperties: false
    PaymentMethodOfferList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodOffer'
      additionalProperties: false
    InitiatePaymentRequest:
      type: object
      description: >-
        POST /v1/storefront/orders/{order}/payments request body
        (stage-08a plan, Endpoints). details carries method-specific
        fields the gateway defines; for cards this is the gateway token
        from hosted fields, never PAN data (system-design 7.5).
      required:
        - method
      properties:
        method:
          type: string
        details:
          type: object
          additionalProperties: true
      additionalProperties: false
    NextAction:
      type: object
      description: >-
        What the buyer must do next to complete the payment (stage-08a
        plan, Endpoints). type none needs nothing, redirect carries
        redirect_url, display_code carries code (e.g. the Pix code).
      required:
        - type
      properties:
        type:
          type: string
          enum: [none, redirect, display_code]
        redirect_url:
          oneOf:
            - type: string
            - type: 'null'
        code:
          oneOf:
            - type: string
            - type: 'null'
      additionalProperties: false
    Payment:
      type: object
      description: >-
        One payment attempt against an order (stage-08a plan,
        Endpoints). expires_at is the end of the method's confirmation
        window, null for synchronous methods; next_action is re-served
        byte-identically on replay and polling.
      required:
        - id
        - order_id
        - status
        - gateway
        - method
        - amount
        - expires_at
        - next_action
        - failure_code
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [initiated, confirmed, failed, expired]
        gateway:
          type: string
        method:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        next_action:
          $ref: '#/components/schemas/NextAction'
        failure_code:
          oneOf:
            - type: string
            - type: 'null'
      additionalProperties: false
    IdempotencyKeyMissingProblem:
      description: >-
        Problem document for payment initiation without the required
        Idempotency-Key header (api-conventions "Idempotency and
        Correlation").
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [400]
            code:
              type: string
              enum: [idempotency_key_missing]
      unevaluatedProperties: false
    PaymentDeclinedProblem:
      description: >-
        Problem document for a synchronous decline (stage-08a plan,
        Endpoints): the order stays pending with the hold intact so the
        buyer retries with another method until the hold expires
        (system-design 7.6).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [402]
            code:
              type: string
              enum: [payment_declined]
      unevaluatedProperties: false
    PaymentInitiationConflictProblem:
      description: >-
        Problem document for payment initiation conflicts (stage-08a
        plan, Endpoints; stage-08c plan, Slice 4; stage-08d plan, Slice
        3): the order is not pending, the Idempotency-Key was reused
        with a different payload, the requested method's gateway has no
        active sub-merchant account, or the only gateway that could
        serve the method is registered but not configured (code
        gateway_not_configured, distinct from gateway_unavailable's
        open-circuit-breaker meaning).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [order_not_payable, idempotency_key_reuse_mismatch, submerchant_not_active, gateway_not_configured]
      unevaluatedProperties: false
    PaymentMethodNotAvailableProblem:
      description: >-
        Problem document for a method outside the order's current offer,
        including slow-method policy and low-inventory exclusions
        (stage-08a plan, Endpoints).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [422]
            code:
              type: string
              enum: [payment_method_not_available, request.validation_failed]
            errors:
              type: object
      unevaluatedProperties: false
    GatewayUnavailableProblem:
      description: >-
        Problem document for an open circuit breaker or an adapter
        transport failure (stage-08a plan, Endpoints; system-design 13).
        Carries Retry-After; nothing about the attempt persists.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [503]
            code:
              type: string
              enum: [gateway_unavailable]
      unevaluatedProperties: false
    Refund:
      type: object
      description: >-
        One refund against a confirmed payment (stage-08b plan,
        Endpoints). Execution is asynchronous; status walks pending,
        processing, then completed or failed through conditional
        transitions.
      required:
        - id
        - payment_id
        - order_id
        - status
        - amount
        - commission_amount
        - reason
        - gateway_reference
        - failure_code
        - created_at
      properties:
        id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
        amount:
          $ref: '#/components/schemas/Money'
        commission_amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: ['string', 'null']
        gateway_reference:
          type: ['string', 'null']
        failure_code:
          type: ['string', 'null']
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    RefundCreateRequest:
      type: object
      description: >-
        A null or absent amount refunds the full remaining refundable
        amount; ticket_ids selects the tickets voided on completion (on
        a full refund all order tickets are voided regardless).
      properties:
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        reason:
          type: ['string', 'null']
          maxLength: 500
        ticket_ids:
          type: ['array', 'null']
          minItems: 1
          items:
            type: string
            format: uuid
      additionalProperties: false
    RefundCursorPage:
      type: object
      description: >-
        Cursor-paginated envelope (data, links, meta) for the refund
        list (stage-08b plan, Endpoints).
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Refund'
        links:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/CursorPageMeta'
      additionalProperties: false
    LedgerEntry:
      type: object
      description: >-
        One append-only double-entry leg (stage-08b plan, Endpoints;
        system-design 7.3).
      required:
        - id
        - account
        - direction
        - amount
        - reference_type
        - reference_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
          enum: [gateway_receivable, gateway_fees, platform_commission, tenant_net]
        direction:
          type: string
          enum: [debit, credit]
        amount:
          $ref: '#/components/schemas/Money'
        reference_type:
          type: string
          enum: [payment, refund]
        reference_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    LedgerEntryCursorPage:
      type: object
      description: >-
        Cursor-paginated envelope (data, links, meta) for the ledger
        entry list (stage-08b plan, Endpoints).
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        links:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/CursorPageMeta'
      additionalProperties: false
    LedgerBalanceList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerBalance'
      additionalProperties: false
    LedgerBalance:
      type: object
      description: >-
        Per-currency, per-account balance computed from the ledger,
        signed by convention (stage-08b plan, Endpoints).
      required:
        - currency
        - account
        - balance
      properties:
        currency:
          type: string
        account:
          type: string
          enum: [gateway_receivable, gateway_fees, platform_commission, tenant_net]
        balance:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    RefundNotFoundProblem:
      description: >-
        Problem document for an unknown or cross-tenant refund id
        (stage-08b plan, Endpoints, code refund_not_found).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [refund_not_found]
      unevaluatedProperties: false
    RefundPaymentNotFoundProblem:
      description: >-
        Problem document for a refund creation naming an unknown or
        cross-tenant payment (stage-08b plan, Endpoints).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [refund_payment_not_found]
      unevaluatedProperties: false
    RefundCreateConflictProblem:
      description: >-
        Problem document for refund creation conflicts (stage-08b plan,
        Endpoints): the payment is not refundable, or the
        Idempotency-Key was reused with a different payload or payment.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [payment_not_refundable, idempotency_key_reuse_mismatch]
      unevaluatedProperties: false
    RefundUnprocessableProblem:
      description: >-
        Problem document for refund creation semantic failures
        (stage-08b plan, Endpoints).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [422]
            code:
              type: string
              enum:
                - request.validation_failed
                - refund_amount_exceeds_refundable
                - refund_currency_mismatch
                - refund_tickets_not_in_order
            errors:
              type: object
      unevaluatedProperties: false
    Payout:
      type: object
      description: >-
        A mirror of one gateway payout object (stage-08c plan, Data
        model "payouts"; system-design 7.3, 8.3). discrepancy is
        non-null only when reconciliation found the mirrored amount
        diverging from ledger expectations.
      required:
        - id
        - gateway
        - gateway_reference
        - amount
        - status
        - executed_at
        - reconciled_at
        - discrepancy
        - created_at
      properties:
        id:
          type: string
          format: uuid
        gateway:
          type: string
        gateway_reference:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [pending, in_transit, paid, failed, canceled]
        executed_at:
          type: ['string', 'null']
          format: date-time
        reconciled_at:
          type: ['string', 'null']
          format: date-time
        discrepancy:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    PayoutCursorPage:
      type: object
      description: >-
        Cursor-paginated envelope (data, links, meta) for the payout
        list (stage-08c plan, Endpoints).
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payout'
        links:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/CursorPageMeta'
      additionalProperties: false
    SubmerchantAccount:
      type: object
      description: >-
        One tenant's onboarding registration with a gateway for split
        payments and payouts (stage-08c plan, Endpoints; system-design
        7.3, 19). requirements is the gateway's outstanding requirement
        keys, opaque strings never typed fields.
      required:
        - id
        - gateway
        - status
        - gateway_account_reference
        - onboarding_url
        - requirements
        - activated_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        gateway:
          type: string
        status:
          type: string
          enum: [pending, under_review, action_required, active, rejected, disabled, needs_review]
        gateway_account_reference:
          type: ['string', 'null']
        onboarding_url:
          type: ['string', 'null']
        requirements:
          type: array
          items:
            type: string
        activated_at:
          type: ['string', 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    StartSubmerchantOnboardingRequest:
      type: object
      description: >-
        gateway must be a registered adapter identifier (stage-08c
        plan, Endpoints).
      required:
        - gateway
      properties:
        gateway:
          type: string
      additionalProperties: false
    SubmerchantAccountPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubmerchantAccount'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    SubmerchantOnboardingConflictProblem:
      description: >-
        Problem document for onboarding-start conflicts (stage-08c
        plan, Endpoints): the gateway is not enabled for the tenant, a
        sub-merchant account for this tenant and gateway already
        exists, in which case existing_id names the pre-existing row, or
        the gateway is registered but not configured
        (gateway_not_configured).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [gateway_not_enabled, submerchant_already_onboarded, gateway_not_configured]
            existing_id:
              type: string
              format: uuid
      unevaluatedProperties: false
    SubmerchantOnboardingUnprocessableProblem:
      description: >-
        Problem document for onboarding-start semantic failures
        (stage-08c plan, Endpoints).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [422]
            code:
              type: string
              enum:
                - request.validation_failed
                - gateway_unknown
            errors:
              type: object
      unevaluatedProperties: false
    WebhookSignatureInvalidProblem:
      description: >-
        Problem document for webhook ingestion when the signature fails
        verification (stage-08a plan, Endpoints); nothing is persisted.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [webhook_signature_invalid]
      unevaluatedProperties: false
    WebhookUnparseableProblem:
      description: >-
        Problem document for webhook ingestion when the body carries no
        extractable gateway event id (stage-08a plan, Endpoints).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [422]
            code:
              type: string
              enum: [webhook_unparseable]
      unevaluatedProperties: false
    OrderNotPayableProblem:
      description: >-
        Problem document for the payment surface when the order is not
        in a state that accepts payment (stage-08a plan, Endpoints).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [order_not_payable]
      unevaluatedProperties: false
    TicketTypeAvailability:
      type: object
      description: >-
        One ticket type's entry in an EventAvailability response
        (stage-06 plan, Endpoints "GET
        /v1/storefront/events/{event}/availability"). available is
        quantity - sold - held, floored at 0; on_sale reflects the
        ticket type's own sales window against the current time.
      required:
        - ticket_type_id
        - available
        - on_sale
      properties:
        ticket_type_id:
          type: string
          format: uuid
        available:
          type: integer
        on_sale:
          type: boolean
      additionalProperties: false
    EventAvailability:
      type: object
      description: >-
        GET /v1/storefront/events/{event}/availability response shape
        (stage-06 plan, Endpoints).
      required:
        - event_id
        - ticket_types
      properties:
        event_id:
          type: string
          format: uuid
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/TicketTypeAvailability'
      additionalProperties: false
    StorefrontEventSeat:
      type: object
      description: >-
        One seat inside a StorefrontEventSeatMap response (stage-06 plan,
        Endpoints "GET /v1/storefront/events/{event}/seats"). status
        collapses held and sold to unavailable; section/row/number come
        from Catalog's own seat template.
      required:
        - event_seat_id
        - seat_id
        - section
        - row
        - number
        - ticket_type_id
        - status
      properties:
        event_seat_id:
          type: string
          format: uuid
        seat_id:
          type: string
          format: uuid
        section:
          type: string
        row:
          type: string
        number:
          type: string
        ticket_type_id:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [available, unavailable, blocked]
      additionalProperties: false
    StorefrontEventSeatMap:
      type: object
      description: >-
        GET /v1/storefront/events/{event}/seats response shape (stage-06
        plan, Endpoints). Unpaginated: a seat map is only useful whole.
      required:
        - event_id
        - seats
      properties:
        event_id:
          type: string
          format: uuid
        seats:
          type: array
          items:
            $ref: '#/components/schemas/StorefrontEventSeat'
      additionalProperties: false
    EventSeat:
      type: object
      description: >-
        One row of GET /v1/events/{event}/seats and one element of PATCH
        /v1/events/{event}/seats's response (stage-06 plan, Endpoints):
        the admin-only shape, statuses never collapsed, hold_id exposed.
      required:
        - event_seat_id
        - event_id
        - seat_id
        - ticket_type_id
        - status
        - hold_id
      properties:
        event_seat_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        seat_id:
          type: string
          format: uuid
        ticket_type_id:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [available, held, sold, blocked]
        hold_id:
          type: [string, 'null']
          format: uuid
      additionalProperties: false
    EventSeatPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventSeat'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    UpdateEventSeatOperation:
      type: object
      description: >-
        One operation inside an UpdateEventSeatsRequest (stage-06 plan,
        Endpoints "PATCH /v1/events/{event}/seats"). ticket_type_id is
        used only when op is assign_ticket_type (null unzones the seat);
        it is ignored for block and unblock.
      required:
        - event_seat_id
        - op
      properties:
        event_seat_id:
          type: string
          format: uuid
        op:
          type: string
          enum: [block, unblock, assign_ticket_type]
        ticket_type_id:
          type: [string, 'null']
          format: uuid
      additionalProperties: false
    EventSeatBatch:
      type: object
      description: >-
        PATCH /v1/events/{event}/seats response shape (stage-06 plan,
        Endpoints): the seats affected by the applied operations, in
        request order.
      required:
        - seats
      properties:
        seats:
          type: array
          items:
            $ref: '#/components/schemas/EventSeat'
      additionalProperties: false
    UpdateEventSeatsRequest:
      type: object
      description: PATCH /v1/events/{event}/seats request body (stage-06 plan, Endpoints).
      required:
        - operations
      properties:
        operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UpdateEventSeatOperation'
      additionalProperties: false
    CreateHoldRequest:
      type: object
      description: >-
        POST /v1/storefront/holds request body (stage-06 plan, Endpoints).
        customer_id is never accepted here: it is derived from an optional
        customer bearer token server-side, never trusted from the body.
        seat_ids is a flat, top-level list, partitioned positionally
        across the requires_seat items in items in request order (each
        such item's own quantity claims the next slice).
      required:
        - event_id
        - items
      properties:
        event_id:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/HoldItemInput'
        seat_ids:
          type: array
          items:
            type: string
            format: uuid
      additionalProperties: false
    TicketTypeCreateRequest:
      type: object
      description: >-
        `quantity` is an additive stage-06 field (Risks: "Quantity input
        ownership"): it does not persist on `ticket_types` itself, it
        seeds the `ticket_type_inventory` counter row (0 when omitted for
        a GA type) and is rejected with `request.validation_failed` when
        `requires_seat` is true, since seated counters are seeded by
        publish-time seat materialization instead.
      required:
        - name
        - price
        - sales_start
        - sales_end
      properties:
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        sales_start:
          type: [string, 'null']
          format: date-time
        sales_end:
          type: [string, 'null']
          format: date-time
        requires_seat:
          type: boolean
          default: false
        quantity:
          type: integer
          minimum: 0
      additionalProperties: false
    TicketTypeUpdateRequest:
      type: object
      description: >-
        `quantity`, given, replaces the ticket type's
        `ticket_type_inventory.quantity` (stage-06 plan, task 3); rejected
        with `request.validation_failed` when the ticket type is (or is
        being changed to) `requires_seat`, and with `insufficient_inventory`
        when it would undercut `sold + held`.
      properties:
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        sales_start:
          type: [string, 'null']
          format: date-time
        sales_end:
          type: [string, 'null']
          format: date-time
        requires_seat:
          type: boolean
        quantity:
          type: integer
          minimum: 0
      additionalProperties: false
    TicketTypePage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TicketType'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    StorefrontTicketType:
      type: object
      description: >-
        Storefront ticket-type shape (stage-05a plan, Endpoints). price is
        the {amount, currency} money object; no requires_seat or
        availability field is exposed until Stage 6.
      required:
        - id
        - name
        - price
        - sales_start
        - sales_end
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        sales_start:
          type: [string, 'null']
          format: date-time
        sales_end:
          type: [string, 'null']
          format: date-time
      additionalProperties: false
    StorefrontEvent:
      type: object
      description: >-
        Storefront event shape (stage-05a plan, Endpoints, Storefront
        surface). name and description are single strings resolved in the
        negotiated locale carried by locale; ticket_types is always
        embedded. Internal state (status, async_payment_policy) is never
        exposed. cover_image and gallery (stage-05c plan, Endpoints:
        "Storefront media exposure") are additive: cover_image is null and
        gallery is an empty array for an event with no attached media.
      required:
        - id
        - name
        - description
        - locale
        - start_at
        - end_at
        - timezone
        - is_virtual
        - virtual_event_url
        - ticket_types
        - cover_image
        - gallery
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        locale:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
          description: IANA timezone identifier.
        is_virtual:
          type: boolean
        virtual_event_url:
          type: [string, 'null']
          format: uri
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/StorefrontTicketType'
        cover_image:
          oneOf:
            - $ref: '#/components/schemas/MediaImage'
            - type: 'null'
        gallery:
          type: array
          items:
            $ref: '#/components/schemas/MediaImage'
      additionalProperties: false
    StorefrontEventPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StorefrontEvent'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    Capability:
      type: object
      description: One entry in the Capability registry (GET /v1/capabilities).
      required:
        - name
        - is_financially_privileged
      properties:
        name:
          type: string
        is_financially_privileged:
          type: boolean
          description: >-
            MFA is mandatory for a role whose capabilities intersect the
            financially privileged set (system-design 5.1); the mechanism
            arrives with a later Stage 3 task.
      additionalProperties: false
    CapabilityList:
      type: object
      description: >-
        GET /v1/capabilities wraps the registry in an object rather than a
        bare array so the response schema can declare
        additionalProperties: false (ADR 019); there is no pagination
        metadata to carry alongside data.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
      additionalProperties: false
    TenantDomainNotFoundProblem:
      description: Problem document for a tenant domain id that references no domain.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [tenant_domain_not_found]
      unevaluatedProperties: false
    TenantDomainConflictProblem:
      description: >-
        Problem document for a domain registration that conflicts with
        existing rows: the domain is already registered platform-wide, or
        the tenant already has a primary domain.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [domain_already_registered, tenant_domain_is_primary]
      unevaluatedProperties: false
    TenantDomainIsPrimaryProblem:
      description: >-
        Problem document for an operation refused because the domain is the
        tenant's primary domain; promote another domain first.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [tenant_domain_is_primary]
      unevaluatedProperties: false
    UnknownDomainProblem:
      description: >-
        Problem document for a well-formed domain that is not registered to
        any tenant; the edge proxy must refuse to issue a certificate.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [unknown_domain]
      unevaluatedProperties: false
    TenantNotFoundProblem:
      description: Problem document for a tenant id that references no tenant.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [tenant_not_found]
      unevaluatedProperties: false
    InvalidCredentialsProblem:
      description: >-
        Problem document for a staff token request that fails: an unknown
        email or a wrong password (code invalid_credentials, both cases
        render identically so the response never reveals whether an
        account exists); an enrolled user's request that omitted mfa_code
        (code mfa_required, stage-03 plan task breakdown item 11); or a
        present mfa_code that matches neither the current TOTP window nor
        any unused recovery code (code mfa_code_invalid).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [invalid_credentials, mfa_required, mfa_code_invalid]
      unevaluatedProperties: false
    CustomerInvalidCredentialsProblem:
      description: >-
        Problem document for a customer token request that fails: an
        unknown email, a wrong password, or a guest account with no
        password (code invalid_credentials in every case, so the response
        never reveals which applies). Customers carry no MFA challenge,
        unlike the staff token endpoint's InvalidCredentialsProblem.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [invalid_credentials]
      unevaluatedProperties: false
    RefreshTokenProblem:
      description: >-
        Problem document for a rejected refresh token: it is expired,
        malformed, or unknown (code invalid_refresh_token, also used for
        the loser of a concurrent rotation race), or it was already
        rotated away from and is being presented again (code
        refresh_token_reused), which also revokes every live token issued
        from its login.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [invalid_refresh_token, refresh_token_reused]
      unevaluatedProperties: false
    CustomerLogoutProblem:
      description: >-
        Problem document for a 401 on POST /v1/auth/customer/logout:
        either a missing, invalid, or expired bearer token (code
        auth.unauthenticated), or a bearer whose tenant_id claim does not
        match the host-resolved tenant (code tenant_mismatch, raised by
        App\Http\Middleware\EnforceCustomerTenantClaim ahead of Passport's
        own token validation).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [auth.unauthenticated, tenant_mismatch]
      unevaluatedProperties: false
    CustomerEmailTakenProblem:
      description: >-
        Problem document for a customer create whose email already has a
        row in this tenant (unique per tenant_id, email).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [customer_email_taken]
      unevaluatedProperties: false
    ClaimTokenProblem:
      description: >-
        Problem document for a rejected customer claim token: it is
        malformed, tampered with, or names a customer that no longer
        resolves under this tenant (code claim_token_invalid), or its
        embedded expiry has passed (code claim_token_expired).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [claim_token_invalid, claim_token_expired]
      unevaluatedProperties: false
    PasswordResetTokenProblem:
      description: >-
        Problem document for a rejected staff password reset token: it is
        unknown, malformed, or already consumed (code
        reset_token_invalid), or its expiry has passed (code
        reset_token_expired).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [reset_token_invalid, reset_token_expired]
      unevaluatedProperties: false
    CustomerAlreadyClaimedProblem:
      description: >-
        Problem document for a claim confirmation presented for a
        customer who already holds a password.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [customer_already_claimed]
      unevaluatedProperties: false
    UnauthenticatedProblem:
      description: >-
        Problem document for a request with a missing, invalid, or expired
        bearer token.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [auth.unauthenticated]
      unevaluatedProperties: false
    MissingCapabilityProblem:
      description: >-
        Problem document for an authenticated caller whose acting
        membership's role does not hold the capability the endpoint
        requires, evaluated as capability plus tenant context, never role
        names (system-design 5.3, ADR 012); or whose acting membership
        mandates confirmed MFA and has not confirmed it (code
        mfa_enforcement_required, stage-03 plan task breakdown item 11),
        raised by EnforceMfaCompliance ahead of this endpoint's capability
        check.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    TenantAccessDeniedProblem:
      description: >-
        Problem document for a staff bearer with no membership in the
        asserted tenant (X-Tenant-Id), raised by ResolveTenantFromHeader
        ahead of any endpoint-specific capability check (stage-03 plan,
        Slice 3); or whose acting membership mandates confirmed MFA and
        has not confirmed it (code mfa_enforcement_required, task
        breakdown item 11), raised by EnforceMfaCompliance after tenant
        resolution.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, mfa_enforcement_required]
      unevaluatedProperties: false
    RoleForbiddenProblem:
      description: >-
        Problem document for a 403 on a role-mutating endpoint: either the
        caller has no membership in the asserted tenant (code
        tenant_access_denied, raised by ResolveTenantFromHeader before the
        handler is reached), the acting membership does not hold
        roles.manage (code missing_capability), or the acting membership
        mandates confirmed MFA and has not confirmed it (code
        mfa_enforcement_required, task breakdown item 11).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    NotFoundProblem:
      description: >-
        Generic problem document for a well-formed identifier that
        resolves to no visible row; reused instead of a resource-specific
        code where the endpoint deliberately renders the same response for
        "does not exist" and "not visible to this caller", so existence
        never leaks (stage-03 plan, Slice 4 isolation denial probes).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [request.not_found]
      unevaluatedProperties: false
    HoldEventNotFoundProblem:
      description: >-
        Problem document for POST /v1/storefront/holds and GET
        /v1/storefront/events/{event}/availability when the given id does
        not resolve to a published event for the resolved tenant
        (stage-06 plan, Endpoints); shared verbatim by both since the
        status and code are identical.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [event_not_found]
      unevaluatedProperties: false
    EventNotSeatedProblem:
      description: >-
        Problem document for GET /v1/storefront/events/{event}/seats when
        the published event carries no materialized seats, i.e. it is
        GA-only (stage-06 plan, Endpoints).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [event_not_seated]
      unevaluatedProperties: false
    EventSeatForbiddenProblem:
      description: >-
        Problem document for a 403 on the admin seat endpoints, reading or
        mutating alike (both require events.manage_seating, stage-06
        plan, task breakdown item 11): either the caller has no
        membership in the asserted tenant (code tenant_access_denied,
        raised by ResolveTenantFromHeader before the handler is reached),
        the acting membership does not hold events.manage_seating (code
        missing_capability), or the acting membership mandates confirmed
        MFA and has not confirmed it (code mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    SeatNotModifiableProblem:
      description: >-
        Problem document for PATCH /v1/events/{event}/seats when any
        operation's own conditional-UPDATE guard fails (stage-06 plan,
        Endpoints): the offending event_seat_ids are listed in the errors
        map.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [seat_not_modifiable]
            errors:
              type: object
              properties:
                event_seat_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
              additionalProperties: false
      unevaluatedProperties: false
    HoldNotFoundProblem:
      description: >-
        Problem document for GET /v1/storefront/holds/{hold} when the id is
        unknown or belongs to a different tenant (stage-06 plan, Endpoints).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [hold_not_found]
      unevaluatedProperties: false
    HoldNotReleasableProblem:
      description: >-
        Problem document for DELETE /v1/storefront/holds/{hold} when the
        hold is committed and so cannot be released (stage-06 plan,
        Endpoints).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [hold_not_releasable]
      unevaluatedProperties: false
    HoldCreateUnprocessableProblem:
      description: >-
        Problem document for POST /v1/storefront/holds that cannot be
        processed: either request validation failed (with the errors map,
        code request.validation_failed), an item's ticket_type_id does
        not belong to the given event (code ticket_type_not_in_event), or
        the seat_ids do not match the requested items (code
        seat_selection_invalid).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [ticket_type_not_in_event]
            - type: object
              properties:
                code:
                  type: string
                  enum: [seat_selection_invalid]
      unevaluatedProperties: false
    HoldCreateConflictProblem:
      description: >-
        Problem document for POST /v1/storefront/holds that conflicts with
        current state: an item's ticket type is outside its sales window
        (code sales_window_closed), the requested quantity exceeds
        availability (code insufficient_inventory, with the failing
        ticket_type_id in the errors map), or one or more requested seats
        are unavailable (code seat_unavailable, with the offending
        seat_ids in the errors map).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              properties:
                code:
                  type: string
                  enum: [sales_window_closed]
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [insufficient_inventory]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [seat_unavailable]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
      unevaluatedProperties: false
    RoleNameTakenProblem:
      description: >-
        Problem document for a role create or rename that collides with
        another role's name in the same tenant.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [role_name_taken]
      unevaluatedProperties: false
    RoleUpdateConflictProblem:
      description: >-
        Problem document for a role update refused because the role is a
        global template (code role_not_editable), or because the new name
        is already taken in the tenant (code role_name_taken).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [role_not_editable, role_name_taken]
      unevaluatedProperties: false
    RoleDeleteConflictProblem:
      description: >-
        Problem document for a role delete refused because the role is a
        global template (code role_not_editable), or because at least one
        membership still references it (code role_in_use).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [role_not_editable, role_in_use]
      unevaluatedProperties: false
    RoleUnprocessableProblem:
      description: >-
        Problem document for a role create or update that cannot be
        processed: either request validation failed (with the errors map)
        or the capabilities list names a capability outside the registry.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [unknown_capability]
      unevaluatedProperties: false
    MembershipForbiddenProblem:
      description: >-
        Problem document for a 403 on a membership-mutating endpoint:
        either the caller has no membership in the asserted tenant (code
        tenant_access_denied, raised by ResolveTenantFromHeader before the
        handler is reached), the acting membership does not hold
        memberships.manage (code missing_capability), or the acting
        membership mandates confirmed MFA and has not confirmed it (code
        mfa_enforcement_required, task breakdown item 11).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    VenueForbiddenProblem:
      description: >-
        Problem document for a 403 on a venue endpoint, reading or
        mutating alike (both require a capability, events.view or
        events.manage respectively, stage-05a plan task breakdown item
        3): either the caller has no membership in the asserted tenant
        (code tenant_access_denied, raised by ResolveTenantFromHeader
        before the handler is reached), the acting membership does not
        hold the required capability (code missing_capability), or the
        acting membership mandates confirmed MFA and has not confirmed it
        (code mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    SeatMapForbiddenProblem:
      description: >-
        Problem document for a 403 on a seat map endpoint, reading or
        mutating alike (both require a capability, events.view or
        seat_maps.manage respectively, stage-05b plan task breakdown items
        2 and 3): either the caller has no membership in the asserted
        tenant (code tenant_access_denied, raised by
        ResolveTenantFromHeader before the handler is reached), the acting
        membership does not hold the required capability (code
        missing_capability), or the acting membership mandates confirmed
        MFA and has not confirmed it (code mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    SeatMapUnprocessableProblem:
      description: >-
        Problem document for a seat map create that cannot be processed:
        request validation failed (code request.validation_failed, with the
        errors map), the seats array carries two or more seats sharing the
        same section, row, and number (code catalog.seat_map_duplicate_seats,
        with the errors map keyed by the offending seats' positions), or the
        name is already taken on the venue (code catalog.seat_map_name_taken,
        stage-05b plan endpoint table).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed, catalog.seat_map_duplicate_seats]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [catalog.seat_map_name_taken]
      unevaluatedProperties: false
    SeatMapDeleteConflictProblem:
      description: >-
        Problem document for a seat map delete refused because at least
        one event still references it through seat_map_id (code
        catalog.seat_map_in_use, stage-05b plan, Deletion semantics: the
        events_seat_map_id_foreign restrict violation the database raises
        on the delete, mapped here rather than surfaced as a 500).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [catalog.seat_map_in_use]
      unevaluatedProperties: false
    EventForbiddenProblem:
      description: >-
        Problem document for a 403 on an event endpoint, reading or
        mutating alike (both require a capability, events.view or
        events.manage respectively, stage-05a plan task breakdown item
        5): either the caller has no membership in the asserted tenant
        (code tenant_access_denied, raised by ResolveTenantFromHeader
        before the handler is reached), the acting membership does not
        hold the required capability (code missing_capability), or the
        acting membership mandates confirmed MFA and has not confirmed it
        (code mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    EventImmutableProblem:
      description: >-
        Problem document for a PATCH on a canceled event (stage-05a plan,
        endpoint table: "catalog.event_immutable (409, event is
        canceled)"). Editing a published event is allowed; only canceled
        is terminal.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [catalog.event_immutable]
      unevaluatedProperties: false
    TicketTypeUpdateConflictProblem:
      description: >-
        Problem document for a PATCH on a ticket type that cannot be
        applied: either the parent event is canceled (code
        catalog.event_immutable), or the given quantity would undercut
        the ticket type's sold plus held counters (code
        insufficient_inventory, stage-06 plan task 3).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [catalog.event_immutable, insufficient_inventory]
      unevaluatedProperties: false
    EventUpdateUnprocessableProblem:
      description: >-
        Problem document for a PATCH on an event that cannot be processed:
        either request validation failed (with the errors map, code
        request.validation_failed), or seat_map_id validation failed
        (stage-05b plan, Endpoints): the seat map does not exist, is not
        visible under RLS, or does not belong to the event's effective
        venue (code catalog.seat_map_venue_mismatch), or the event's
        effective is_virtual is true while seat_map_id is non-null (code
        catalog.seat_map_virtual_event), mirroring
        TicketTypeUnprocessableProblem's own precedent for combining
        multiple codes at the same status.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [catalog.seat_map_venue_mismatch, catalog.seat_map_virtual_event]
      unevaluatedProperties: false
    EventNotPublishableProblem:
      description: >-
        Problem document for a publish that is refused (stage-05a plan,
        endpoint table: "catalog.event_not_publishable (409)"; stage-06
        plan, Slice 5: "catalog.seat_map_required (409)"). Either the
        event is not in a publishable state (only a draft event can be
        published; an already-published or canceled event is rejected),
        or the event carries a requires_seat ticket type but no
        seat_map_id.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [catalog.event_not_publishable, catalog.seat_map_required]
      unevaluatedProperties: false
    EventNotCancelableProblem:
      description: >-
        Problem document for a cancel on an event that is not in a
        cancelable state (stage-05a plan, endpoint table:
        "catalog.event_not_cancelable (409)"). A draft or published event
        can be canceled; an already-canceled event is rejected.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [catalog.event_not_cancelable]
      unevaluatedProperties: false
    TicketTypeForbiddenProblem:
      description: >-
        Problem document for a 403 on a ticket type endpoint, reading or
        mutating alike (both require a capability, events.view or
        events.manage respectively, stage-05a plan task breakdown item
        8): either the caller has no membership in the asserted tenant
        (code tenant_access_denied, raised by ResolveTenantFromHeader
        before the handler is reached), the acting membership does not
        hold the required capability (code missing_capability), or the
        acting membership mandates confirmed MFA and has not confirmed it
        (code mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    TicketTypeUnprocessableProblem:
      description: >-
        Problem document for a ticket type create or update that cannot be
        processed: either request validation failed (with the errors map,
        code request.validation_failed), or the submitted price currency
        does not match the tenant's settlement currency (code
        catalog.currency_mismatch, stage-05a plan endpoint table),
        mirroring RoleUnprocessableProblem's own precedent for combining
        two distinct codes at the same status.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [catalog.currency_mismatch]
      unevaluatedProperties: false
    MembershipExistsProblem:
      description: >-
        Problem document for an invite whose target user already has a
        membership in the tenant.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [membership_exists]
      unevaluatedProperties: false
    LastOwnerRemovalProblem:
      description: >-
        Problem document for a role change or removal that would leave
        the tenant with no membership holding the global Owner template
        role.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [last_owner_removal]
      unevaluatedProperties: false
    InvitationTokenProblem:
      description: >-
        Problem document for a rejected staff invitation acceptance
        token: it is malformed, tampered with, or names a user that no
        longer resolves (code invitation_token_invalid), or its embedded
        expiry has passed (code invitation_token_expired).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [invitation_token_invalid, invitation_token_expired]
      unevaluatedProperties: false
    MfaAlreadyEnrolledProblem:
      description: >-
        Problem document for POST /v1/auth/mfa/enrollment when the caller
        has already confirmed MFA (stage-03 plan, task breakdown item 11).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [mfa_already_enrolled]
      unevaluatedProperties: false
    MfaConfirmProblem:
      description: >-
        Problem document for a 401 on POST /v1/auth/mfa/enrollment/confirm
        or POST /v1/auth/mfa/disable: a missing, invalid, or expired
        bearer token (code auth.unauthenticated), or a presented code that
        matches neither the current TOTP window nor any unused recovery
        code (code mfa_code_invalid).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [auth.unauthenticated, mfa_code_invalid]
      unevaluatedProperties: false
    MfaNotEnrolledProblem:
      description: >-
        Problem document for POST /v1/auth/mfa/enrollment/confirm or POST
        /v1/auth/mfa/disable when no enrollment has ever been started
        (stage-03 plan, task breakdown item 11).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [mfa_not_enrolled]
      unevaluatedProperties: false
    MfaEnforcedForRoleProblem:
      description: >-
        Problem document for POST /v1/auth/mfa/disable when at least one
        of the caller's memberships is platform-scope or holds a
        financially privileged capability (stage-03 plan, MFA enforcement
        paragraph).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [mfa_enforced_for_role]
      unevaluatedProperties: false
    InvalidQueryParameterProblem:
      description: >-
        Problem document for an unknown filter or sort parameter on an
        allowlisted list endpoint; unknown parameters are rejected, never
        ignored.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [400]
            code:
              type: string
              enum: [invalid_query_parameter]
      unevaluatedProperties: false
    TenantUnprocessableProblem:
      description: >-
        Problem document for a tenant write that cannot be processed: either
        request validation failed (with the errors map) or the default
        locale falls outside the supported locales.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [default_locale_not_supported]
      unevaluatedProperties: false
    Money:
      type: object
      description: >-
        Monetary value per docs/api-conventions.md: integer minor units paired
        with an uppercase ISO 4217 currency code. Amounts never appear on the
        wire without a currency, and never as floats.
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          description: >-
            Amount in the currency's minor units (e.g. centavos). May be
            negative (refunds, corrections).
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Uppercase ISO 4217 currency code.
      additionalProperties: false
    HealthReport:
      type: object
      required:
        - status
        - checks
        - checked_at
      properties:
        status:
          type: string
          enum: [ok]
          description: >-
            Always ok on a 200 response; degraded states are returned as the
            503 problem document.
        checks:
          $ref: '#/components/schemas/HealthChecks'
        checked_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of check execution.
      additionalProperties: false
    Problem:
      type: object
      description: >-
        RFC 9457 problem document shared by every error response under /v1
        per docs/api-conventions.md. Specific problems extend it with
        extension members.
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            Stable problem type URI reference, /problems/{slug} with the slug
            derived mechanically from code (dots and underscores become
            dashes).
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code of the response.
        detail:
          type: string
          description: >-
            Human-readable occurrence detail. Never stable contract; clients
            branch on code instead.
        code:
          type: string
          description: Stable machine-readable code; clients branch on this.
        correlation_id:
          type: string
          description: >-
            Echo of the request correlation ID also carried in the
            X-Correlation-Id response header.
    ValidationProblem:
      description: >-
        Problem document for failed request validation, extended with the
        errors map of field name to messages.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            status:
              type: integer
              enum: [422]
            code:
              type: string
              enum: [request.validation_failed]
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: Map of field name to validation messages.
      unevaluatedProperties: false
    HealthDegradedProblem:
      description: >-
        Problem document for the degraded health report, extended with the
        health checks. Frozen contract; the correlation ID travels only in
        the X-Correlation-Id header on this response.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - checks
            - checked_at
          properties:
            status:
              type: integer
              enum: [503]
            code:
              type: string
              enum: [health.degraded]
            checks:
              $ref: '#/components/schemas/HealthChecks'
            checked_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp of check execution.
      unevaluatedProperties: false
    HealthChecks:
      type: object
      required:
        - database
        - redis
        - storage
      properties:
        database:
          $ref: '#/components/schemas/CheckResult'
        redis:
          $ref: '#/components/schemas/CheckResult'
        storage:
          $ref: '#/components/schemas/CheckResult'
      additionalProperties: false
    CheckResult:
      type: string
      enum: [ok, failed]
    MediaConversions:
      type: object
      description: >-
        Fixed conversion-name shape (stage-05c plan, Endpoints:
        "conversions: { thumb, card, hero }"). Each value is null until
        its queued conversion job completes, then becomes the conversion's
        URL; the key stays present throughout so the wire shape never
        changes underneath a client.
      required:
        - thumb
        - card
        - hero
      properties:
        thumb:
          type: [string, 'null']
          format: uri
        card:
          type: [string, 'null']
          format: uri
        hero:
          type: [string, 'null']
          format: uri
      additionalProperties: false
    Media:
      type: object
      description: >-
        Admin surface response shape for a medialibrary-backed file
        (stage-05c plan, Endpoints: "Admin event media" and "Admin tenant
        branding media"), shared by every collection this app registers
        (event cover and gallery, tenant logo).
      required:
        - id
        - collection
        - file_name
        - mime_type
        - size
        - url
        - conversions
        - alt_text
        - order
        - created_at
      properties:
        id:
          type: string
          format: uuid
        collection:
          type: string
          enum: [cover, gallery, logo]
        file_name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
          description: File size in bytes.
        url:
          type: string
          format: uri
        conversions:
          $ref: '#/components/schemas/MediaConversions'
        alt_text:
          type: [string, 'null']
        order:
          type: integer
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    EventMediaList:
      type: object
      description: >-
        Bounded, unpaginated list envelope for GET
        /v1/events/{event}/media (stage-05c plan, Endpoints: "Returns 200
        with data array of MediaData"), unlike the standard
        data/links/meta paginator envelope: this list is never large
        enough to need pagination.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Media'
      additionalProperties: false
    MediaImage:
      type: object
      description: >-
        Storefront-facing image shape (stage-05c plan, Endpoints:
        "Storefront media exposure"), additive on StorefrontEvent's
        cover_image and gallery fields. Narrower than the admin Media
        schema: no collection, file_name, mime_type, size, order, or
        created_at, since the storefront never needs those.
      required:
        - id
        - url
        - conversions
        - alt_text
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        conversions:
          $ref: '#/components/schemas/MediaConversions'
        alt_text:
          type: [string, 'null']
      additionalProperties: false
    EventMediaUploadRequest:
      type: object
      description: >-
        Multipart request body for POST /v1/events/{event}/media
        (stage-05c plan, Endpoints).
      required:
        - file
        - collection
      properties:
        file:
          type: string
          format: binary
          description: >-
            image/jpeg, image/png, or image/webp, up to the
            media.max_upload_kb config ceiling.
        collection:
          type: string
          enum: [cover, gallery]
      additionalProperties: false
    TenantMediaUploadRequest:
      type: object
      description: >-
        Multipart request body for POST /v1/tenants/{tenant}/media
        (stage-05c plan, Endpoints: "Admin tenant branding media").
      required:
        - file
        - collection
      properties:
        file:
          type: string
          format: binary
          description: >-
            image/jpeg, image/png, or image/webp, up to the
            media.max_upload_kb config ceiling.
        collection:
          type: string
          enum: [logo]
      additionalProperties: false
    EventMediaForbiddenProblem:
      description: >-
        Problem document for a 403 on an event media endpoint or the
        shared DELETE /v1/media/{media} endpoint: either the caller has no
        membership in the asserted tenant (code tenant_access_denied,
        raised by ResolveTenantFromHeader before the handler is reached),
        the acting membership does not hold the required capability (code
        missing_capability, resolved statically from events.manage/
        events.view for the nested routes, or dynamically from the
        media's own owning model for the shared delete route), or the
        acting membership mandates confirmed MFA and has not confirmed it
        (code mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    PayloadTooLargeProblem:
      description: >-
        Problem document for a request body exceeding the server's
        maximum accepted size (code payload_too_large), rendered by the
        Stage 1 problem handler before request validation ever runs
        (stage-05c plan, task-02: "Includes 413 payload_too_large problem
        rendering via the Stage 1 handler").
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [413]
            code:
              type: string
              enum: [payload_too_large]
      unevaluatedProperties: false
