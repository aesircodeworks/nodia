      summary: Fetch a promo code including usage_count
      description: >-
        Tenant admin surface behind promo_codes.manage (stage-07 plan,
        Endpoints).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The promo code.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
