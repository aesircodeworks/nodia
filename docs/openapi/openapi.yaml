          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HoldEventNotFoundProblem'
  /v1/storefront/events/{event}/seats:
    parameters:
      - name: event
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStorefrontEventSeats
      summary: Fetch the per-seat map for a published, seated event
      description: >-
        Storefront surface: unauthenticated, tenant resolved from the Host
        header (stage-06 plan, Endpoints "GET
        /v1/storefront/events/{event}/seats"). held and sold both render
        as status unavailable on this wire (buyers never need the
        distinction, and it avoids leaking sales pace). Seat metadata
        (section, row, number) is composed from Catalog's seats template,
        never joined. A draft, canceled, foreign-tenant, or nonexistent
        event id all render the same event_not_found problem, so
        unpublished existence never leaks; a published GA-only event
        (carrying no materialized seats) renders event_not_seated.
      responses:
        '200':
          description: The event's per-seat map.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontEventSeatMap'
        '404':
          description: >-
            No published event is visible with this id for the resolved
            tenant (drafts, canceled, and foreign-tenant events included).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HoldEventNotFoundProblem'
        '409':
          description: The event is published but carries no seat map (GA only).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventNotSeatedProblem'
  /v1/storefront/holds:
    post:
      operationId: createHold
      summary: Create a hold on GA inventory
      description: >-
        Storefront surface: guest checkout, no authentication required
        (stage-06 plan, Endpoints "POST /v1/storefront/holds"). customer_id
        is never accepted in the request body; it is derived from an
        optional customer bearer token and stays null for anonymous
        guests. seat_ids is a flat, top-level list, partitioned
        positionally across the requires_seat items in the order they
        appear in items: each such item's own quantity claims the next
        slice. expires_at is 10 minutes from creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldRequest'
      responses:
        '201':
          description: The created hold.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '404':
          description: >-
            The given event_id does not resolve to a published event for
            the resolved tenant (code event_not_found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HoldEventNotFoundProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed, with
            the errors map), an item's ticket_type_id does not belong to
            the given event (code ticket_type_not_in_event), or the
            seat_ids do not match the requested items: a requires_seat
            item is missing seats, the seat count does not match its
            quantity, or seats were given for a GA item (code
            seat_selection_invalid).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HoldCreateUnprocessableProblem'
        '409':
          description: >-
            An item's ticket type is outside its sales window (code
            sales_window_closed), the requested quantity exceeds
            availability (code insufficient_inventory, with the failing
            ticket_type_id in the errors map), or one or more requested
            seats are held, sold, blocked, or belong to the wrong zone or
            event (code seat_unavailable, with the offending seat_ids in
            the errors map).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HoldCreateConflictProblem'
  /v1/storefront/holds/{hold}:
    parameters:
      - name: hold
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStorefrontHold
      summary: Fetch a hold for the countdown display
      description: >-
        Storefront surface: guest checkout, no authentication required. A
        nonexistent or cross-tenant hold id renders the same hold_not_found
        problem, so hold existence never leaks across tenants (RLS makes
        cross-tenant a natural not-found).
      responses:
        '200':
          description: The hold.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '404':
          description: No hold has this id for the resolved tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HoldNotFoundProblem'
    delete:
      operationId: releaseStorefrontHold
      summary: Release a hold
      description: >-
        Storefront surface: guest checkout, no authentication required
        (stage-06 plan, Endpoints "DELETE /v1/storefront/holds/{hold}").
        Idempotent: releasing an already-released hold, or one the expiry
        sweeper already expired, returns 204 again rather than an error.
      responses:
        '204':
          description: >-
            The hold is released (or was already released or expired).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '404':
          description: No hold has this id for the resolved tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HoldNotFoundProblem'
        '409':
          description: The hold is committed and cannot be released.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HoldNotReleasableProblem'
  /v1/storefront/orders:
    post:
      operationId: createOrder
      summary: Convert a hold into a pending order
      description: >-
        Storefront surface, customer bearer token required (stage-07
        plan, Endpoints "Buyer-facing"): every order has a customer from
        creation. The hold must be anonymous or already belong to the
        authenticated customer; conversion attaches the customer to an
        anonymous hold exactly once. Inventory stays held; nothing
        commits until the paid transition. attendee_names is keyed by
        ticket type id, one list of names per line.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: The created order, status pending.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Missing or invalid customer bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '404':
          description: >-
            The hold does not exist for this tenant or belongs to a
            different customer (code hold_not_found; not-found semantics
            so hold ids never leak ownership).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderHoldNotFoundProblem'
        '409':
          description: >-
            The hold's expires_at has passed regardless of sweeper state
            (code checkout.hold_expired), or an order already references
            this hold (code hold_already_converted).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderCreateConflictProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed,
            with the errors map), or the promo_code is unknown for this
            tenant (promo_code_invalid), outside its validity window
            (promo_code_not_active), at its usage limit
            (promo_code_exhausted), or a fixed-amount code in another
            currency (promo_code_currency_mismatch); the whole conversion
            rolls back.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderCreateUnprocessableProblem'
  /v1/storefront/promo-codes/check:
    post:
      operationId: checkPromoCode
      summary: Preview a promo code against a hold
      description: >-
        Storefront surface, customer bearer token required (stage-07
        plan, Endpoints). A read-only preview of the code against the
        hold's priced subtotal; never increments usage_count. Always 200
        for a resolvable hold: an unusable code answers valid false with
        its stable reason_code rather than a problem document.
      security:
