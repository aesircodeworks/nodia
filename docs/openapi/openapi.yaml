  /v1/payments/{payment}/refunds:
    parameters:
      - name: payment
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createRefund
      summary: Create a refund for a confirmed payment
      description: >-
        Staff surface under the tenancy.admin group (stage-08b plan,
        Endpoints; system-design 7.5, 14.2): requires the orders.refund
        capability, a confirmed-MFA session, and the Idempotency-Key
        header; the mutation is activity-logged. A null or absent amount
        refunds the full remaining refundable amount. Execution is
        asynchronous: the 201 carries a pending refund and completion is
        driven by the gateway webhook with a reconciliation sweeper
        backstop. Replays with the same key return the original body
        with 200.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundCreateRequest'
      responses:
        '201':
          description: The pending refund.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '200':
          description: Replay of a previous creation with the same key.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          description: Missing Idempotency-Key header.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/IdempotencyKeyMissingProblem'
        '401':
          description: Missing or invalid staff bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            Missing orders.refund capability, or the acting membership
            mandates confirmed MFA (code mfa_enforcement_required).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: >-
            Unknown or cross-tenant payment id (code
            refund_payment_not_found); RLS makes foreign payments
            unfindable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RefundPaymentNotFoundProblem'
        '409':
          description: >-
            The payment is not confirmed or its order is not in a
            refundable status (code payment_not_refundable), or the key
            was reused with a different payload or payment (code
            idempotency_key_reuse_mismatch).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RefundCreateConflictProblem'
        '422':
          description: >-
            Validation failure, an amount past the remaining refundable
            (code refund_amount_exceeds_refundable), a currency
            differing from the payment (code refund_currency_mismatch),
            or tickets outside the order (code
            refund_tickets_not_in_order).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RefundUnprocessableProblem'
