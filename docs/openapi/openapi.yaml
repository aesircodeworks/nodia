      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
