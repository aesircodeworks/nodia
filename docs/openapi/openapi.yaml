openapi: 3.1.0
info:
  title: Nodia API
  description: >-
    Repository OpenAPI specification per docs/api-conventions.md. Each
    feature's contract fragment (specs/*/contracts/) is merged here as its
    endpoints ship. Response shapes are generated from laravel-data objects;
    this document mirrors them and must not drift from them.
  version: 0.1.0
paths:
  /v1/tenants:
    post:
      operationId: createTenant
      summary: Create a tenant
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability, evaluated against the acting membership under the
        sentinel platform tenant (stage-03 plan, task breakdown item 7,
        closing the Stage 2 placeholder auth alias deferral).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed, with
            the errors map) or the default locale is not one of the supported
            locales (code default_locale_not_supported).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantUnprocessableProblem'
    get:
      operationId: listTenants
      summary: List tenants
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). Page pagination with the standard
        Laravel paginator envelope. Allowed query-builder parameters are
        filter[name] and sort in (name, created_at, -name, -created_at);
        unknown filters or sorts are rejected with 400
        invalid_query_parameter, never ignored. The parameter schemas below
        stay loose on purpose: the allowlist is enforced by the API, not by
        request-shape validation.
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          description: 'Allowed filters: filter[name] (partial match).'
          schema:
            type: object
            properties:
              name:
                type: string
            additionalProperties:
              type: string
        - name: sort
          in: query
          required: false
          description: 'Allowed sorts: name, created_at, -name, -created_at.'
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of tenants.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
        '400':
          description: Unknown filter or sort parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidQueryParameterProblem'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
  /v1/tenants/{tenant}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTenant
      summary: Fetch one tenant
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantNotFoundProblem'
    patch:
      operationId: updateTenant
      summary: Update a tenant
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). All fields are optional; absent
        fields are left untouched. Branding and locale fields route to the
        UpdateBranding action, gateway fields to ConfigureGateways.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: The updated tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantNotFoundProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed, with
            the errors map) or the effective default locale would fall
            outside the effective supported locales (code
            default_locale_not_supported).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantUnprocessableProblem'
  /v1/tenants/{tenant}/media:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: uploadTenantMedia
      summary: Upload a tenant branding logo
      description: >-
        Platform admin surface: Passport staff bearer plus the
        tenants.manage capability, evaluated under the platform posture
        like every other tenant mutation (stage-05c plan, Endpoints:
        "Admin tenant branding media"). Multipart request: file
        (image/jpeg, image/png, or image/webp, up to the
        media.max_upload_kb config ceiling) and collection (logo, the
        only value Tenant registers). Uploading replaces the existing
        logo file, since it is a single-file collection. Deletion goes
        through the shared DELETE /v1/media/{media}.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TenantMediaUploadRequest'
      responses:
        '201':
          description: Media uploaded.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantNotFoundProblem'
        '413':
          description: >-
            The request body exceeds the server's maximum accepted size,
            rendered before request validation runs (code
            payload_too_large).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PayloadTooLargeProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed,
            with the errors map): the file field is missing, its mime
            type is outside the image/jpeg, image/png, image/webp
            allowlist, it exceeds the configured size ceiling, or
            collection is not logo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/tenants/{tenant}/domains:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: registerTenantDomain
      summary: Register a domain for a tenant
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). The domain is normalized to
        lowercase before it is stored, so the response always carries the
        lowercase form. A domain resolves to exactly one tenant
        platform-wide.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantDomainRegisterRequest'
      responses:
        '201':
          description: Domain registered.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDomain'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantNotFoundProblem'
        '409':
          description: >-
            The domain is already registered to a tenant (code
            domain_already_registered), or is_primary was requested and the
            tenant already has a primary domain (code
            tenant_domain_is_primary; promote through the tenant-domains
            PATCH instead).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantDomainConflictProblem'
        '422':
          description: Request validation failed, including malformed hostnames.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
    get:
      operationId: listTenantDomains
      summary: List a tenant's domains
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). Page pagination with the standard
        Laravel paginator envelope, sorted by domain; no query-builder
        parameters.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of the tenant's domains.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDomainPage'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantNotFoundProblem'
  /v1/tenant-domains/{tenant_domain}:
    parameters:
      - name: tenant_domain
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTenantDomain
      summary: Make a domain the tenant's primary domain
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). Item operations live at this
        top-level resource because nesting under /v1/tenants/{tenant}/domains
        would exceed the one-level nesting rule. is_primary only accepts
        true; a domain is demoted by promoting another domain, so a demotion
        request is rejected as unprocessable. The promotion is idempotent:
        replaying it returns the current state without writing.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantDomainUpdateRequest'
      responses:
        '200':
          description: The domain, primary after promotion.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDomain'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant domain has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantDomainNotFoundProblem'
        '422':
          description: Request validation failed, including is_primary false.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
    delete:
      operationId: removeTenantDomain
      summary: Remove a domain
      description: >-
        Platform admin surface: Passport staff bearer plus the tenants.manage
        capability (task breakdown item 7). The tenant's primary domain
        cannot be removed; promote another domain first.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Domain removed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The acting membership does not hold tenants.manage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MissingCapabilityProblem'
        '404':
          description: No tenant domain has this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantDomainNotFoundProblem'
        '409':
          description: The domain is the tenant's primary domain; demote it first.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantDomainIsPrimaryProblem'
  /v1/auth/staff/token:
    post:
      operationId: issueStaffToken
      summary: Exchange staff credentials for a token pair
      description: >-
        Unauthenticated. Drives Passport's password grant directly rather
        than Passport's own /oauth/token route (docs/decisions/011). An
        unknown email and a correct email with the wrong password both fail
        with the same invalid_credentials code, so the response never
        reveals whether an account exists. The access token is a JWT
        carrying identity_type staff and the subject id; it carries no
        tenant claim, because the acting tenant is asserted per request via
        X-Tenant-Id (docs/api-conventions.md). Once credentials are valid,
        an enrolled user (mfa_enabled) must also supply mfa_code, either
        the current TOTP code or an unused recovery code (consumed
        atomically on use): omitting it fails with mfa_required, a wrong
        or already-used one with mfa_code_invalid (stage-03 plan, task
        breakdown item 11; Risks: "MFA challenge inside the OAuth token
        exchange").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffTokenRequest'
      responses:
        '200':
          description: A new access and refresh token pair.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: >-
            The email is unknown or the password is wrong (code
            invalid_credentials, both cases render identically); an
            enrolled user's request omitted mfa_code (code mfa_required);
            or the presented mfa_code is wrong or already used (code
            mfa_code_invalid).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidCredentialsProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/staff/refresh:
    post:
      operationId: refreshStaffToken
      summary: Rotate a staff refresh token for a new token pair
      description: >-
        Unauthenticated (the refresh token itself is the credential).
        Rotation is single-use: the presented refresh token is revoked in
        the same request that issues its replacement, guarded by a
        conditional UPDATE checked by affected-row count so two concurrent
        rotations of the same token succeed exactly once (docs/decisions/011,
        stage-03 plan Slice 2). Presenting an already-rotated refresh token
        is treated as reuse: it revokes every live token issued from the
        same original login (code refresh_token_reused). An expired,
        malformed, or unknown refresh token fails with
        invalid_refresh_token, as does the loser of a concurrent rotation
        race.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: A new access and refresh token pair.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: >-
            The refresh token is expired, malformed, or unknown (code
            invalid_refresh_token), or it was already rotated away from
            and is being presented again (code refresh_token_reused),
            which also revokes every live token issued from its login.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RefreshTokenProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/staff/logout:
    post:
      operationId: logoutStaff
      summary: Revoke the current staff session
      description: >-
        Staff bearer only. Revokes the presented access token and its live
        refresh token; other sessions for the same user are unaffected
        (stage-03 plan, Slice 2).
      security:
        - BearerAuth: []
      responses:
        '204':
          description: The session's access and refresh token are revoked.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
  /v1/auth/staff/invitation/accept:
    post:
      operationId: acceptStaffInvitation
      summary: Accept a staff invitation and set first credentials
      description: >-
        Unauthenticated: the token itself is the credential (stage-03
        plan, task breakdown item 9). Redeems the signed, time-limited
        acceptance token POST /v1/memberships mails to a newly invited
        user and sets their password, replacing the random unusable one
        InviteUser generated. The token is stateless (App\Identity\Support\InvitationToken):
        tampering with it, or presenting one whose embedded expiry has
        passed, fail with distinct codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '204':
          description: The password is set; the account can now authenticate.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: >-
            The token is malformed, tampered with, or names a user that no
            longer resolves (code invitation_token_invalid), or its
            embedded expiry has passed (code invitation_token_expired).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvitationTokenProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/staff/password/reset:
    post:
      operationId: requestStaffPasswordReset
      summary: Request a staff password reset email
      description: >-
        Unauthenticated. Always renders 202 regardless of whether the
        email resolves to a staff user (enumeration-safe, mirroring POST
        /v1/auth/customer/claim, stage-03 plan Slice 8); a reset token is
        issued and mailed only for a genuine user
        (App\Identity\Mail\PasswordResetMail). Unlike the stateless
        invitation and claim tokens, the reset token is stored, hashed at
        rest, single-use, and expires after
        identity.reset_token_ttl_minutes (one hour by default),
        deliberately shorter than either sibling window because it acts
        against an already-existing credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: >-
            The request was accepted; a reset email is sent if and only
            if the address resolves to a staff user, which this response
            never reveals.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/staff/password/reset/confirm:
    post:
      operationId: confirmStaffPasswordReset
      summary: Confirm a staff password reset and set a new password
      description: >-
        Unauthenticated: the token itself is the credential (stage-03
        plan, task breakdown item 16). Redeems the single-use reset token
        POST /v1/auth/staff/password/reset mails to a staff user's own
        address and sets their password; every access and refresh token
        previously issued to the user is revoked in the same transaction,
        so only the new password authenticates afterwards. Consumption is
        a conditional UPDATE on the token's consumed state checked by
        affected-row count, so parallel confirmations of one token
        succeed exactly once; a consumed, unknown, or malformed token and
        an expired one fail with distinct codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordResetRequest'
      responses:
        '204':
          description: >-
            The password is set; every previously issued token is revoked
            and the account authenticates with the new password only.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: >-
            The token is unknown, malformed, or already consumed (code
            reset_token_invalid), or its expiry has passed (code
            reset_token_expired).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PasswordResetTokenProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/mfa/enrollment:
    post:
      operationId: enrollMfa
      summary: Begin TOTP MFA enrollment
      description: >-
        Staff bearer only; asserts no tenant (stage-03 plan, MFA endpoint
        table). Generates a fresh TOTP secret and stores it unconfirmed;
        POST /v1/auth/mfa/enrollment/confirm verifies a code against it
        and flips MFA on. Calling this again before confirming simply
        replaces the pending secret. Deliberately outside the
        tenancy.admin and tenancy.platform groups, so a caller whose
        acting membership requires confirmed MFA can always reach this
        endpoint (mfa_enforcement_required never applies here).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The pending TOTP secret and its otpauth:// URI.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollment'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '409':
          description: MFA is already enrolled and confirmed for this account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MfaAlreadyEnrolledProblem'
  /v1/auth/mfa/enrollment/confirm:
    post:
      operationId: confirmMfaEnrollment
      summary: Confirm TOTP MFA enrollment and receive recovery codes
      description: >-
        Staff bearer only; asserts no tenant (stage-03 plan, MFA endpoint
        table). Verifies code against the pending secret POST
        /v1/auth/mfa/enrollment stored, then flips MFA on and issues a
        fresh batch of single-use recovery codes. The plaintext codes are
        returned in this response only and never again; only their
        digests are persisted.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmMfaRequest'
      responses:
        '200':
          description: The account's MFA is confirmed; recovery codes are issued once.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodes'
        '401':
          description: >-
            Missing, invalid, or expired bearer token, or the presented
            code does not match the pending secret's current TOTP window
            (code mfa_code_invalid).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MfaConfirmProblem'
        '409':
          description: No enrollment has been started (code mfa_not_enrolled).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MfaNotEnrolledProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/mfa/disable:
    post:
      operationId: disableMfa
      summary: Disable TOTP MFA
      description: >-
        Staff bearer only; asserts no tenant (stage-03 plan, MFA endpoint
        table). Accepts either a valid TOTP code or a still-unused
        recovery code as proof of possession. Denied while any of the
        caller's memberships, in any tenant, mandate confirmed MFA
        (platform-scope, or a role holding a financially privileged
        capability): disabling under an enforcing membership is
        mfa_enforced_for_role, checked before the code so a doomed request
        never spends a recovery code.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableMfaRequest'
      responses:
        '204':
          description: MFA is disabled; the secret and all recovery codes are cleared.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: >-
            Missing, invalid, or expired bearer token, or the presented
            code is wrong or already used (code mfa_code_invalid).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MfaConfirmProblem'
        '403':
          description: >-
            At least one of the caller's memberships mandates confirmed
            MFA (code mfa_enforced_for_role).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MfaEnforcedForRoleProblem'
        '409':
          description: MFA is not enrolled for this account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MfaNotEnrolledProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Fetch the authenticated staff user
      description: >-
        Staff bearer only; asserts no tenant. memberships lists every one
        of the caller's own membership rows across every tenant, resolved
        through the memberships_self_read RLS policy with app.user_id set
        by the auth layer.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The authenticated staff user.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
  /v1/auth/customer/token:
    post:
      operationId: issueCustomerToken
      summary: Exchange customer credentials for a token pair
      description: >-
        Unauthenticated; tenant is resolved from the Host header
        (docs/api-conventions.md; stage-03 plan, task breakdown item 13).
        An unknown email, a wrong password, and a guest account with no
        password (docs/decisions/007) all fail identically with
        invalid_credentials, so the response never reveals which case
        applies. The access token is a JWT carrying identity_type
        customer and tenant_id, valid only for the tenant it was issued
        under (system-design 5.4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerTokenRequest'
      responses:
        '200':
          description: A new access and refresh token pair.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: >-
            The email is unknown, the password is wrong, or the account
            is an unclaimed guest with no password (code
            invalid_credentials in every case).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CustomerInvalidCredentialsProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/customer/refresh:
    post:
      operationId: refreshCustomerToken
      summary: Rotate a customer refresh token for a new token pair
      description: >-
        Unauthenticated (the refresh token itself is the credential),
        tenant resolved from the Host header. Rotation, reuse detection,
        and family revocation are identical to POST
        /v1/auth/staff/refresh (docs/decisions/011, stage-03 plan Slice
        2): single-use, guarded by a conditional UPDATE checked by
        affected-row count, and presenting an already-rotated token
        revokes every live token issued from the same login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: A new access and refresh token pair.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: >-
            The refresh token is expired, malformed, or unknown (code
            invalid_refresh_token), or it was already rotated away from
            and is being presented again (code refresh_token_reused).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RefreshTokenProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/customer/logout:
    post:
      operationId: logoutCustomer
      summary: Revoke the current customer session
      description: >-
        Customer bearer, tenant resolved from the Host header. Revokes
        the presented access token and its live refresh token, mirroring
        POST /v1/auth/staff/logout (stage-03 plan, Slice 2). A bearer
        whose tenant_id claim does not match the host-resolved tenant is
        rejected before Passport's own token validation runs
        (App\Http\Middleware\EnforceCustomerTenantClaim).
      security:
        - BearerAuth: []
      responses:
        '204':
          description: The session's access and refresh token are revoked.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: >-
            Missing, invalid, or expired bearer token (code
            auth.unauthenticated), or a bearer whose tenant_id claim does
            not match the host-resolved tenant (code tenant_mismatch).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CustomerLogoutProblem'
  /v1/customers:
    get:
      operationId: listCustomers
      summary: Look up customers in the acting tenant
      description: >-
        Tenant admin surface: Passport staff bearer plus X-Tenant-Id
        membership validation, plus the customers.view capability
        (stage-07 plan, task breakdown item 10; implemented in the
        Identity context since Orders never touches customers). Allowed
        query-builder parameters are filter[email] (exact match) and
        filter[name] (prefix match); unknown filters or sorts are
        rejected with 400 invalid_query_parameter, never ignored.
        Cursor-paginated over descending id (UUIDv7, so descending
        creation time).
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          description: >-
            Allowed filters: filter[email] (exact match), filter[name]
            (prefix match).
          schema:
            type: object
            properties:
              email:
                type: string
              name:
                type: string
            additionalProperties:
              type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: One cursor page of customer summaries.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSummaryCursorPage'
        '400':
          description: >-
            A filter or sort parameter outside the endpoint allowlist
            (code invalid_query_parameter).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidQueryParameterProblem'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            No membership in the asserted tenant (code
            tenant_access_denied), missing customers.view (code
            missing_capability), or unconfirmed mandated MFA (code
            mfa_enforcement_required).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StaffCapabilityForbiddenProblem'
    post:
      operationId: registerCustomer
      summary: Create a guest or fully registered customer
      description: >-
        Unauthenticated; tenant resolved from the Host header. Omitting
        password (or sending null) creates an unclaimed guest usable for
        checkout but not login (docs/decisions/007); sending a password
        registers the customer outright. locale falls back to the
        tenant's own default_locale when omitted (system-design 12). The
        same email address independently registers under every other
        tenant (unique per tenant, system-design 5.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
      responses:
        '201':
          description: The created customer.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '409':
          description: This tenant already has a customer with this email.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CustomerEmailTakenProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/customer/claim:
    post:
      operationId: requestCustomerClaim
      summary: Request a guest account claim email
      description: >-
        Unauthenticated; tenant resolved from the Host header. Always
        renders 202 regardless of whether the email exists, already has
        a password, or is a genuine unclaimed guest (enumeration-safe,
        mirroring the staff password reset request endpoint's own
        design, stage-03 plan Slice 8); a claim token is mailed only for
        a genuine unclaimed guest (App\Identity\Mail\CustomerClaimMail).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '202':
          description: >-
            The request was accepted; a claim email is sent if and only
            if the address resolves to an unclaimed guest, which this
            response never reveals.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/auth/customer/claim/confirm:
    post:
      operationId: confirmCustomerClaim
      summary: Confirm a guest account claim and set a password
      description: >-
        Unauthenticated: the token itself is the credential (stage-03
        plan, task breakdown item 13). Redeems the stateless, time-limited
        claim token POST /v1/auth/customer/claim mails to a guest
        customer's own address and sets their password, after which POST
        /v1/auth/customer/token authenticates them. The token is stateless
        (App\Identity\Support\ClaimToken): tampering with it, or
        presenting one whose embedded expiry has passed, fail with
        distinct codes; a customer who already holds a password is
        rejected with customer_already_claimed, which is also what makes
        replaying a still-valid token after its first use harmless.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmClaimRequest'
      responses:
        '204':
          description: The password is set; the account can now authenticate.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: >-
            The token is malformed, tampered with, or names a customer
            that no longer resolves under this tenant (code
            claim_token_invalid), or its embedded expiry has passed (code
            claim_token_expired).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimTokenProblem'
        '409':
          description: This customer already holds a password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CustomerAlreadyClaimedProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/roles:
    get:
      operationId: listRoles
      summary: List roles visible in the acting tenant
      description: >-
        Tenant admin surface: Passport staff bearer plus X-Tenant-Id
        membership validation (tenancy.admin); no capability is required to
        read (stage-03 plan, task breakdown item 8). Page pagination with
        the standard Laravel paginator envelope.
        roles_template_or_tenant_read RLS scopes the result to the global
        template roles plus this tenant's own custom roles, so the
        endpoint needs no filtering beyond the allowlist. Allowed
        query-builder parameters are filter[name] and sort in (name,
        -name); unknown filters or sorts are rejected with 400
        invalid_query_parameter, never ignored.
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          description: 'Allowed filters: filter[name] (partial match).'
          schema:
            type: object
            properties:
              name:
                type: string
            additionalProperties:
              type: string
        - name: sort
          in: query
          required: false
          description: 'Allowed sorts: name, -name.'
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of roles visible in the acting tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '400':
          description: Unknown filter or sort parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidQueryParameterProblem'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The caller has no membership in the asserted tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantAccessDeniedProblem'
    post:
      operationId: createRole
      summary: Create a custom role in the acting tenant
      description: >-
        Tenant admin surface: Passport staff bearer, X-Tenant-Id membership
        validation, plus the roles.manage capability (stage-03 plan, task
        breakdown item 8). Every capability in the request must be a real
        entry in the Capability registry (code unknown_capability) and the
        name must be unique within the tenant (code role_name_taken).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '201':
          description: Role created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            The caller has no membership in the asserted tenant (code
            tenant_access_denied), or the acting membership does not hold
            roles.manage (code missing_capability).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RoleForbiddenProblem'
        '409':
          description: A role with this name already exists in the tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RoleNameTakenProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed, with
            the errors map) or the capabilities list names a capability
            outside the registry (code unknown_capability).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RoleUnprocessableProblem'
  /v1/roles/{role}:
    parameters:
      - name: role
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRole
      summary: Fetch one role
      description: >-
        Tenant admin surface: Passport staff bearer plus X-Tenant-Id
        membership validation; no capability required to read (task
        breakdown item 8). A well-formed but nonexistent or foreign-tenant
        role id renders the same generic request.not_found problem a
        malformed id gets from route-parameter matching: another tenant's
        custom role is invisible under roles_template_or_tenant_read RLS,
        so existence never leaks (stage-03 plan, Slice 4 isolation denial
        probes).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The role.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: The caller has no membership in the asserted tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TenantAccessDeniedProblem'
        '404':
          description: No role is visible with this id in the acting tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
    patch:
      operationId: updateRole
      summary: Update a tenant's custom role
      description: >-
        Tenant admin surface: Passport staff bearer, X-Tenant-Id membership
        validation, plus the roles.manage capability (task breakdown item
        8). Both fields are optional; absent fields are left untouched. A
        global template role can never be updated (code role_not_editable).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: The updated role.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            The caller has no membership in the asserted tenant (code
            tenant_access_denied), or the acting membership does not hold
            roles.manage (code missing_capability).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RoleForbiddenProblem'
        '404':
          description: No role is visible with this id in the acting tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: >-
            The role is a global template and cannot be modified (code
            role_not_editable), or the new name is already taken in the
            tenant (code role_name_taken).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RoleUpdateConflictProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed, with
            the errors map) or the capabilities list names a capability
            outside the registry (code unknown_capability).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RoleUnprocessableProblem'
    delete:
      operationId: deleteRole
      summary: Delete a tenant's custom role
      description: >-
        Tenant admin surface: Passport staff bearer, X-Tenant-Id membership
        validation, plus the roles.manage capability (task breakdown item
        8). A global template role can never be deleted (code
        role_not_editable); a role still referenced by at least one
        membership cannot be deleted either (code role_in_use).
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Role deleted.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            The caller has no membership in the asserted tenant (code
            tenant_access_denied), or the acting membership does not hold
            roles.manage (code missing_capability).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RoleForbiddenProblem'
        '404':
          description: No role is visible with this id in the acting tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: >-
            The role is a global template and cannot be deleted (code
            role_not_editable), or at least one membership still references
            it (code role_in_use).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RoleDeleteConflictProblem'
  /v1/capabilities:
    get:
