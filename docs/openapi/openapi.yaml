openapi: 3.1.0
info:
  title: Nodia API
  description: >-
    Repository OpenAPI specification per docs/api-conventions.md. Each
    feature's contract fragment (specs/*/contracts/) is merged here as its
    endpoints ship. Response shapes are generated from laravel-data objects;
    this document mirrors them and must not drift from them.
  version: 0.1.0
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report API health and backing service connectivity
      description: >-
        Unauthenticated. Returns 200 when all backing services are reachable,
        503 as an RFC 9457 problem document when any check fails. Every
        response echoes the X-Correlation-Id header per
        docs/api-conventions.md.
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Correlation ID; generated by the server when absent.
      responses:
        '200':
          description: All backing services reachable.
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
              examples:
                healthy:
                  value:
                    status: ok
                    checks:
                      database: ok
                      redis: ok
                      storage: ok
                    checked_at: '2026-07-04T12:00:00Z'
        '503':
          description: >-
            At least one backing service check failed. RFC 9457 problem
            document per docs/api-conventions.md, with the health checks
            carried as extension members.
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HealthDegradedProblem'
              examples:
                degraded:
                  value:
                    type: '/problems/health-degraded'
                    title: 'Service degraded'
                    status: 503
                    detail: 'One or more backing services failed their health check.'
                    code: 'health.degraded'
                    checks:
                      database: ok
                      redis: failed
                      storage: ok
                    checked_at: '2026-07-04T12:00:00Z'
components:
  schemas:
    Money:
      type: object
      description: >-
        Monetary value per docs/api-conventions.md: integer minor units paired
        with an uppercase ISO 4217 currency code. Amounts never appear on the
        wire without a currency, and never as floats.
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          description: >-
            Amount in the currency's minor units (e.g. centavos). May be
            negative (refunds, corrections).
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Uppercase ISO 4217 currency code.
      additionalProperties: false
    HealthReport:
      type: object
      required:
        - status
        - checks
        - checked_at
      properties:
        status:
          type: string
          enum: [ok]
          description: >-
            Always ok on a 200 response; degraded states are returned as the
            503 problem document.
        checks:
          $ref: '#/components/schemas/HealthChecks'
        checked_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of check execution.
      additionalProperties: false
    Problem:
      type: object
      description: >-
        RFC 9457 problem document shared by every error response under /v1
        per docs/api-conventions.md. Specific problems extend it with
        extension members.
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            Stable problem type URI reference, /problems/{slug} with the slug
            derived mechanically from code (dots and underscores become
            dashes).
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code of the response.
        detail:
          type: string
          description: >-
            Human-readable occurrence detail. Never stable contract; clients
            branch on code instead.
        code:
          type: string
          description: Stable machine-readable code; clients branch on this.
        correlation_id:
          type: string
          description: >-
            Echo of the request correlation ID also carried in the
            X-Correlation-Id response header.
    ValidationProblem:
      description: >-
        Problem document for failed request validation, extended with the
        errors map of field name to messages.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            status:
              type: integer
              enum: [422]
            code:
              type: string
              enum: [request.validation_failed]
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: Map of field name to validation messages.
      unevaluatedProperties: false
    HealthDegradedProblem:
      description: >-
        Problem document for the degraded health report, extended with the
        health checks. Frozen contract; the correlation ID travels only in
        the X-Correlation-Id header on this response.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - checks
            - checked_at
          properties:
            status:
              type: integer
              enum: [503]
            code:
              type: string
              enum: [health.degraded]
            checks:
              $ref: '#/components/schemas/HealthChecks'
            checked_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp of check execution.
      unevaluatedProperties: false
    HealthChecks:
      type: object
      required:
        - database
        - redis
        - storage
      properties:
        database:
          $ref: '#/components/schemas/CheckResult'
        redis:
          $ref: '#/components/schemas/CheckResult'
        storage:
          $ref: '#/components/schemas/CheckResult'
      additionalProperties: false
    CheckResult:
      type: string
      enum: [ok, failed]
