  /v1/storefront/orders/{order}/payments:
    parameters:
      - name: order
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: initiatePayment
      summary: Initiate a payment for a pending order
      description: >-
        Storefront surface, customer bearer token and Idempotency-Key
        header required (stage-08a plan, Endpoints; system-design 7.5).
        Synchronous approval pays the order within this request; a
        synchronous decline returns 402 with the order still pending and
        the hold intact; async methods return next_action and move the
        order to awaiting_payment with the hold extended to the method's
        confirmation window. Replays with the same key return the
        original body with 200.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequest'
      responses:
        '201':
          description: The initiated payment.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '200':
          description: Replay of a previous initiation with the same key.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Missing Idempotency-Key header.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/IdempotencyKeyMissingProblem'
        '401':
          description: Missing or invalid customer bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '402':
          description: Synchronous decline; the order stays pending with the hold intact.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PaymentDeclinedProblem'
        '404':
          description: >-
            Missing, other tenant (via RLS), or other customer (code
            request.not_found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: >-
            The order is not pending (code order_not_payable), the key
            was reused with a different payload (code
            idempotency_key_reuse_mismatch), the method's gateway has
            no active sub-merchant account (code submerchant_not_active),
            or the method's gateway is registered but not configured
            (code gateway_not_configured).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PaymentInitiationConflictProblem'
        '422':
          description: >-
            Validation failure, or the method is outside the current
            offer (code payment_method_not_available).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PaymentMethodNotAvailableProblem'
        '503':
          description: >-
            Open circuit breaker or gateway transport failure; carries
            Retry-After.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GatewayUnavailableProblem'
  /v1/storefront/payments/{payment}:
    parameters:
      - name: payment
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStorefrontPayment
      summary: Poll a payment
      description: >-
        Storefront surface, customer bearer token required (stage-08a
        plan, Endpoints). Reports the payment leg of an async initiation
        and re-serves next_action (e.g. the Pix code); the storefront
        polls the order endpoint for the order status flip.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The payment.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          description: Missing or invalid customer bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '404':
          description: >-
            Missing, other tenant (via RLS), or other customer (code
            request.not_found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
  /v1/webhooks/{gateway}:
    parameters:
      - name: gateway
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: ingestGatewayWebhook
      summary: Ingest a gateway webhook
      description: >-
        Gateway-facing ingestion, one route per registered adapter
        (stage-08a plan, Endpoints; system-design 3.2). Unauthenticated
        and exempt from tenant resolution; the adapter's signature
        verification is the gate. Persist first, always 2xx after
        persist; duplicate gateway event ids insert-conflict into a
        no-op reusing the existing row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Persisted (or already persisted); empty body.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          description: Signature verification failed; nothing persisted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WebhookSignatureInvalidProblem'
        '404':
          description: No registered adapter for this gateway (code request.not_found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '422':
          description: >-
            Signature valid but no gateway event id extractable (code
            webhook_unparseable); nothing persisted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WebhookUnparseableProblem'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Passport-issued JWT access token (docs/decisions/011). Carries
        identity_type and, for customers only, tenant_id.
  headers:
    XCorrelationId:
      description: Echo of the request correlation ID per docs/api-conventions.md.
      schema:
        type: string
        format: uuid
    ContentLanguage:
      description: The negotiated locale the storefront response was resolved in.
      schema:
        type: string
  schemas:
    StaffTokenRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        mfa_code:
          type: [string, 'null']
          description: >-
            Required once the user has confirmed MFA: either the current
            TOTP code or an unused recovery code (stage-03 plan, task
            breakdown item 11).
      additionalProperties: false
    TokenPair:
      type: object
      description: >-
        OAuth 2.0 bearer token pair issued by Passport's password grant
        (docs/decisions/011).
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: Short-lived JWT; see BearerAuth for its claims.
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
      additionalProperties: false
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
      additionalProperties: false
    CustomerTokenRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      additionalProperties: false
    RegisterCustomerRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: [string, 'null']
          description: >-
            Omitted or null creates an unclaimed guest (docs/decisions/007).
        locale:
          type: [string, 'null']
          description: Falls back to the tenant's default_locale when omitted.
      additionalProperties: false
    Customer:
      type: object
      required:
        - id
        - email
        - name
        - locale
        - is_claimed
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        locale:
          type: string
        is_claimed:
          type: boolean
          description: True once the customer holds a password (registered or claimed).
      additionalProperties: false
    ClaimRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
      additionalProperties: false
    ConfirmClaimRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
      additionalProperties: false
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
      additionalProperties: false
    ConfirmPasswordResetRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
      additionalProperties: false
    Membership:
      type: object
      description: >-
        One row of CurrentUser.memberships: the caller's own membership in
        one tenant (scope tenant) or their platform-scope administrator
        membership (scope platform, tenant_id the sentinel platform
        tenant). Also the response shape for POST /v1/memberships and
        PATCH /v1/memberships/{membership}, and the element type of
        MembershipPage's data (stage-03 plan, task breakdown item 9).
      required:
        - id
        - user_id
        - user_name
        - user_email
        - tenant_id
        - role_id
        - role_name
        - scope
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        user_email:
          type: string
          format: email
        tenant_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        role_name:
          type: string
        scope:
          type: string
          enum: [tenant, platform]
      additionalProperties: false
    MembershipPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    InviteUserRequest:
      type: object
      required:
        - email
        - name
        - role_id
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role_id:
          type: string
          format: uuid
      additionalProperties: false
    ChangeMembershipRoleRequest:
      type: object
      required:
        - role_id
      properties:
        role_id:
          type: string
          format: uuid
      additionalProperties: false
    AcceptInvitationRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
      additionalProperties: false
    CurrentUser:
      type: object
      required:
        - id
        - name
        - email
        - mfa_enabled
        - memberships
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        mfa_enabled:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      additionalProperties: false
    MfaEnrollment:
      type: object
      description: >-
        Response for POST /v1/auth/mfa/enrollment (stage-03 plan, task
        breakdown item 11). The secret is not yet confirmed; POST
        /v1/auth/mfa/enrollment/confirm verifies a code against it.
      required:
        - secret
        - otpauth_uri
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
          description: otpauth:// URI for an authenticator app to scan or import.
      additionalProperties: false
    ConfirmMfaRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: The current TOTP code from the pending secret's authenticator app.
      additionalProperties: false
    MfaRecoveryCodes:
      type: object
      description: >-
        Response for POST /v1/auth/mfa/enrollment/confirm. The plaintext
        codes are returned here only and never again.
      required:
        - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
      additionalProperties: false
    DisableMfaRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: A current TOTP code or a still-unused recovery code.
      additionalProperties: false
    BrandingSettings:
      type: object
      description: >-
        Tenant branding configuration. logo_url is populated from the
        tenant's uploaded logo media (stage-05c plan, Endpoints: "Admin
        tenant branding media") when one exists; otherwise it falls back
        to whatever this JSON configuration itself carries.
      properties:
        primary_color:
          type: [string, 'null']
        logo_url:
          type: [string, 'null']
      additionalProperties: false
    Tenant:
      type: object
      required:
        - id
        - name
        - branding_settings
        - default_locale
        - supported_locales
        - enabled_gateways
        - payout_schedule
        - commission_bps
        - refund_commission_policy
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        branding_settings:
          $ref: '#/components/schemas/BrandingSettings'
        default_locale:
          type: string
        supported_locales:
          type: array
          items:
            type: string
        enabled_gateways:
          type: array
          items:
            type: string
        payout_schedule:
          type: [object, 'null']
          description: >-
            Opaque configuration until the payouts stage defines and
            validates its schema.
        commission_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Platform commission in basis points of gross.
        refund_commission_policy:
          type: string
          enum: [returned, retained]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    TenantCreateRequest:
      type: object
      required:
        - name
        - default_locale
        - supported_locales
      properties:
        name:
          type: string
        default_locale:
          type: string
        supported_locales:
          type: array
          items:
            type: string
        branding_settings:
          $ref: '#/components/schemas/BrandingSettings'
        enabled_gateways:
          type: array
          items:
            type: string
        payout_schedule:
          type: [object, 'null']
      additionalProperties: false
    TenantUpdateRequest:
      type: object
      properties:
        name:
          type: string
        branding_settings:
          $ref: '#/components/schemas/BrandingSettings'
        default_locale:
          type: string
        supported_locales:
          type: array
          items:
            type: string
        enabled_gateways:
          type: array
          items:
            type: string
        payout_schedule:
          type: [object, 'null']
        commission_bps:
          type: integer
          minimum: 0
          maximum: 10000
        refund_commission_policy:
          type: string
          enum: [returned, retained]
      additionalProperties: false
    TenantPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
