    Venue:
      type: object
      description: >-
        A tenant-scoped physical location events can be held at (stage-05a
        plan, Data model).
      required:
        - id
        - tenant_id
        - name
        - address
        - city
        - country
        - capacity
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2.
        capacity:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    VenueCreateRequest:
      type: object
      required:
        - name
        - address
        - city
        - country
        - capacity
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2.
        capacity:
          type: integer
          minimum: 1
      additionalProperties: false
    VenueUpdateRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2.
        capacity:
          type: integer
          minimum: 1
      additionalProperties: false
    VenuePage:
