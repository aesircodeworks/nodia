        (stage-06 plan, Endpoints "GET /v1/events/{event}/seats").
        Statuses are never collapsed here (unlike the storefront seat
        read) and hold_id is exposed. Allowed query-builder parameters
        are filter[status] and filter[ticket_type_id] (both exact match);
        unknown filters are rejected with 400 invalid_query_parameter,
        never ignored. A well-formed but nonexistent, unpublished, or
        foreign-tenant event id renders event_not_found, since
        materialized seats only ever exist on a published event.
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          description: >-
            Allowed filters: filter[status], filter[ticket_type_id] (both
            exact match).
          schema:
            type: object
            properties:
              status:
                type: string
              ticket_type_id:
                type: string
            additionalProperties:
              type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of the event's seats.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSeatPage'
        '400':
          description: An unknown filter parameter was given.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidQueryParameterProblem'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            The caller has no membership in the asserted tenant (code
            tenant_access_denied), the acting membership does not hold
            events.manage_seating (code missing_capability), or the
            acting membership mandates confirmed MFA and has not
            confirmed it (code mfa_enforcement_required).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSeatForbiddenProblem'
        '404':
          description: No published event is visible with this id in the acting tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HoldEventNotFoundProblem'
    patch:
      operationId: updateEventSeats
      summary: Apply bulk seat operations (block, unblock, zoning)
      description: >-
        Tenant admin surface: Passport staff bearer, X-Tenant-Id
        membership validation, plus the events.manage_seating capability
        (stage-06 plan, Endpoints "PATCH /v1/events/{event}/seats"). Every
        operation in the request runs in one transaction: block and
        unblock each guard on the seat's current status
        (available<->blocked only; held or sold seats are never
        blockable), and assign_ticket_type rezones an available seat to a
        requires_seat ticket type of the same event (or null to unzone),
        adjusting the affected ticket_type_inventory counters in the same
        transaction. Any operation's guard failure rolls back the whole
        batch with 409 seat_not_modifiable, listing every offending
        event_seat_id.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventSeatsRequest'
      responses:
        '200':
          description: The seats affected by the applied operations.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSeatBatch'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            The caller has no membership in the asserted tenant (code
            tenant_access_denied), the acting membership does not hold
            events.manage_seating (code missing_capability), or the
            acting membership mandates confirmed MFA and has not
            confirmed it (code mfa_enforcement_required).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventSeatForbiddenProblem'
        '404':
          description: No published event is visible with this id in the acting tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HoldEventNotFoundProblem'
        '409':
          description: >-
            One or more operations' guards failed (code
            seat_not_modifiable, with the offending event_seat_ids in the
            errors map).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SeatNotModifiableProblem'
        '422':
          description: >-
            Request validation failed, including an unknown op (code
            request.validation_failed, with the errors map).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
