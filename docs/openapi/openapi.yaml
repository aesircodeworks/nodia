    patch:
      operationId: updatePromoCode
      summary: Partially update a promo code
      description: >-
        Tenant admin surface behind promo_codes.manage, audited
        (stage-07 plan, Endpoints). code, discount_type, discount_value,
        and currency are immutable once usage_count > 0 (sending the
        unchanged value back stays accepted); validity windows remain
        editable, so deactivation is setting valid_to.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPromoCodeRequest'
      responses:
        '200':
          description: The updated promo code.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCode'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            No membership in the asserted tenant, missing
            promo_codes.manage, or unconfirmed mandated MFA.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StaffCapabilityForbiddenProblem'
        '404':
          description: >-
            No promo code has this id for the acting tenant (code
            request.not_found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed,
            with the errors map), or a locked field changed after first
            use (code promo_code_immutable_field).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PromoCodeUpdateUnprocessableProblem'
