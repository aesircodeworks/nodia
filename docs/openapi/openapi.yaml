            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeCheck'
        '401':
          description: Missing or invalid customer bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '404':
          description: >-
            The hold does not exist for this tenant or belongs to a
            different customer (code hold_not_found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/OrderHoldNotFoundProblem'
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /v1/orders:
    get:
      operationId: listOrders
      summary: List orders in the acting tenant
      description: >-
        Tenant admin surface behind orders.view (stage-07 plan,
        Endpoints). High-volume, so cursor-paginated over descending id
        (UUIDv7, so descending creation time). Allowed query-builder
        parameters are filter[status], filter[event_id],
        filter[customer_id] (exact) and filter[created_from] /
        filter[created_to] (created_at range); no sorts are allowed;
        unknown parameters are rejected with 400
        invalid_query_parameter, never ignored.
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          description: >-
            Allowed filters: filter[status], filter[event_id],
            filter[customer_id] (exact), filter[created_from],
            filter[created_to] (created_at range).
          schema:
            type: object
            properties:
              status:
                type: string
              event_id:
                type: string
              customer_id:
                type: string
              created_from:
                type: string
              created_to:
                type: string
            additionalProperties:
              type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: One cursor page of orders.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCursorPage'
        '400':
          description: >-
            A filter or sort parameter outside the endpoint allowlist
            (code invalid_query_parameter).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidQueryParameterProblem'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            No membership in the asserted tenant, missing orders.view,
            or unconfirmed mandated MFA.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StaffCapabilityForbiddenProblem'
  /v1/orders/{order}:
    parameters:
      - name: order
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOrder
      summary: Fetch an order with tickets and customer summary
      description: >-
        Tenant admin surface behind orders.view (stage-07 plan,
        Endpoints). The customer summary is composed through Identity,
        never a join.
      security:
        - BearerAuth: []
      responses:
        '200':
