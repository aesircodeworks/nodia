          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    Capability:
      type: object
      description: One entry in the Capability registry (GET /v1/capabilities).
      required:
        - name
        - is_financially_privileged
      properties:
        name:
          type: string
        is_financially_privileged:
          type: boolean
          description: >-
            MFA is mandatory for a role whose capabilities intersect the
            financially privileged set (system-design 5.1); the mechanism
            arrives with a later Stage 3 task.
      additionalProperties: false
    CapabilityList:
      type: object
      description: >-
        GET /v1/capabilities wraps the registry in an object rather than a
        bare array so the response schema can declare
        additionalProperties: false (ADR 019); there is no pagination
        metadata to carry alongside data.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
      additionalProperties: false
    TenantDomainNotFoundProblem:
      description: Problem document for a tenant domain id that references no domain.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [tenant_domain_not_found]
      unevaluatedProperties: false
    TenantDomainConflictProblem:
      description: >-
        Problem document for a domain registration that conflicts with
        existing rows: the domain is already registered platform-wide, or
        the tenant already has a primary domain.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [domain_already_registered, tenant_domain_is_primary]
      unevaluatedProperties: false
    TenantDomainIsPrimaryProblem:
      description: >-
        Problem document for an operation refused because the domain is the
        tenant's primary domain; promote another domain first.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [tenant_domain_is_primary]
      unevaluatedProperties: false
    UnknownDomainProblem:
      description: >-
        Problem document for a well-formed domain that is not registered to
        any tenant; the edge proxy must refuse to issue a certificate.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [unknown_domain]
      unevaluatedProperties: false
    TenantNotFoundProblem:
      description: Problem document for a tenant id that references no tenant.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [tenant_not_found]
      unevaluatedProperties: false
    InvalidCredentialsProblem:
      description: >-
        Problem document for a staff token request that fails: an unknown
        email or a wrong password (code invalid_credentials, both cases
        render identically so the response never reveals whether an
        account exists); an enrolled user's request that omitted mfa_code
        (code mfa_required, stage-03 plan task breakdown item 11); or a
        present mfa_code that matches neither the current TOTP window nor
        any unused recovery code (code mfa_code_invalid).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [invalid_credentials, mfa_required, mfa_code_invalid]
      unevaluatedProperties: false
    CustomerInvalidCredentialsProblem:
      description: >-
        Problem document for a customer token request that fails: an
        unknown email, a wrong password, or a guest account with no
        password (code invalid_credentials in every case, so the response
        never reveals which applies). Customers carry no MFA challenge,
        unlike the staff token endpoint's InvalidCredentialsProblem.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [invalid_credentials]
      unevaluatedProperties: false
    RefreshTokenProblem:
      description: >-
        Problem document for a rejected refresh token: it is expired,
        malformed, or unknown (code invalid_refresh_token, also used for
        the loser of a concurrent rotation race), or it was already
        rotated away from and is being presented again (code
        refresh_token_reused), which also revokes every live token issued
        from its login.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [invalid_refresh_token, refresh_token_reused]
      unevaluatedProperties: false
    CustomerLogoutProblem:
      description: >-
        Problem document for a 401 on POST /v1/auth/customer/logout:
        either a missing, invalid, or expired bearer token (code
        auth.unauthenticated), or a bearer whose tenant_id claim does not
        match the host-resolved tenant (code tenant_mismatch, raised by
        App\Http\Middleware\EnforceCustomerTenantClaim ahead of Passport's
        own token validation).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [auth.unauthenticated, tenant_mismatch]
      unevaluatedProperties: false
    CustomerEmailTakenProblem:
      description: >-
        Problem document for a customer create whose email already has a
        row in this tenant (unique per tenant_id, email).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [customer_email_taken]
      unevaluatedProperties: false
    ClaimTokenProblem:
      description: >-
        Problem document for a rejected customer claim token: it is
        malformed, tampered with, or names a customer that no longer
        resolves under this tenant (code claim_token_invalid), or its
        embedded expiry has passed (code claim_token_expired).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [claim_token_invalid, claim_token_expired]
      unevaluatedProperties: false
    PasswordResetTokenProblem:
      description: >-
        Problem document for a rejected staff password reset token: it is
        unknown, malformed, or already consumed (code
        reset_token_invalid), or its expiry has passed (code
        reset_token_expired).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [reset_token_invalid, reset_token_expired]
      unevaluatedProperties: false
    CustomerAlreadyClaimedProblem:
      description: >-
        Problem document for a claim confirmation presented for a
        customer who already holds a password.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [customer_already_claimed]
      unevaluatedProperties: false
    UnauthenticatedProblem:
      description: >-
        Problem document for a request with a missing, invalid, or expired
        bearer token.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [auth.unauthenticated]
      unevaluatedProperties: false
    MissingCapabilityProblem:
      description: >-
        Problem document for an authenticated caller whose acting
        membership's role does not hold the capability the endpoint
        requires, evaluated as capability plus tenant context, never role
        names (system-design 5.3, ADR 012); or whose acting membership
        mandates confirmed MFA and has not confirmed it (code
        mfa_enforcement_required, stage-03 plan task breakdown item 11),
        raised by EnforceMfaCompliance ahead of this endpoint's capability
        check.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    TenantAccessDeniedProblem:
      description: >-
        Problem document for a staff bearer with no membership in the
        asserted tenant (X-Tenant-Id), raised by ResolveTenantFromHeader
        ahead of any endpoint-specific capability check (stage-03 plan,
        Slice 3); or whose acting membership mandates confirmed MFA and
        has not confirmed it (code mfa_enforcement_required, task
        breakdown item 11), raised by EnforceMfaCompliance after tenant
        resolution.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, mfa_enforcement_required]
      unevaluatedProperties: false
    RoleForbiddenProblem:
      description: >-
        Problem document for a 403 on a role-mutating endpoint: either the
        caller has no membership in the asserted tenant (code
        tenant_access_denied, raised by ResolveTenantFromHeader before the
        handler is reached), the acting membership does not hold
        roles.manage (code missing_capability), or the acting membership
        mandates confirmed MFA and has not confirmed it (code
        mfa_enforcement_required, task breakdown item 11).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    NotFoundProblem:
      description: >-
        Generic problem document for a well-formed identifier that
        resolves to no visible row; reused instead of a resource-specific
        code where the endpoint deliberately renders the same response for
        "does not exist" and "not visible to this caller", so existence
        never leaks (stage-03 plan, Slice 4 isolation denial probes).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [request.not_found]
      unevaluatedProperties: false
    RoleNameTakenProblem:
      description: >-
        Problem document for a role create or rename that collides with
        another role's name in the same tenant.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [role_name_taken]
      unevaluatedProperties: false
    RoleUpdateConflictProblem:
      description: >-
        Problem document for a role update refused because the role is a
        global template (code role_not_editable), or because the new name
        is already taken in the tenant (code role_name_taken).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [role_not_editable, role_name_taken]
      unevaluatedProperties: false
    RoleDeleteConflictProblem:
      description: >-
        Problem document for a role delete refused because the role is a
        global template (code role_not_editable), or because at least one
        membership still references it (code role_in_use).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [role_not_editable, role_in_use]
      unevaluatedProperties: false
    RoleUnprocessableProblem:
      description: >-
        Problem document for a role create or update that cannot be
        processed: either request validation failed (with the errors map)
        or the capabilities list names a capability outside the registry.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [unknown_capability]
      unevaluatedProperties: false
    MembershipForbiddenProblem:
      description: >-
        Problem document for a 403 on a membership-mutating endpoint:
        either the caller has no membership in the asserted tenant (code
        tenant_access_denied, raised by ResolveTenantFromHeader before the
        handler is reached), the acting membership does not hold
        memberships.manage (code missing_capability), or the acting
        membership mandates confirmed MFA and has not confirmed it (code
        mfa_enforcement_required, task breakdown item 11).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    VenueForbiddenProblem:
      description: >-
        Problem document for a 403 on a venue endpoint, reading or
        mutating alike (both require a capability, events.view or
        events.manage respectively, stage-05a plan task breakdown item
        3): either the caller has no membership in the asserted tenant
        (code tenant_access_denied, raised by ResolveTenantFromHeader
        before the handler is reached), the acting membership does not
        hold the required capability (code missing_capability), or the
        acting membership mandates confirmed MFA and has not confirmed it
        (code mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    SeatMapForbiddenProblem:
      description: >-
        Problem document for a 403 on the seat map create endpoint (stage-05b
        plan task breakdown item 2): either the caller has no membership in
        the asserted tenant (code tenant_access_denied, raised by
        ResolveTenantFromHeader before the handler is reached), the acting
        membership does not hold seat_maps.manage (code missing_capability),
        or the acting membership mandates confirmed MFA and has not
        confirmed it (code mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    SeatMapUnprocessableProblem:
      description: >-
        Problem document for a seat map create that cannot be processed:
        request validation failed (code request.validation_failed, with the
        errors map), the seats array carries two or more seats sharing the
        same section, row, and number (code catalog.seat_map_duplicate_seats,
        with the errors map keyed by the offending seats' positions), or the
        name is already taken on the venue (code catalog.seat_map_name_taken,
        stage-05b plan endpoint table).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed, catalog.seat_map_duplicate_seats]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [catalog.seat_map_name_taken]
      unevaluatedProperties: false
    EventForbiddenProblem:
      description: >-
        Problem document for a 403 on an event endpoint, reading or
        mutating alike (both require a capability, events.view or
        events.manage respectively, stage-05a plan task breakdown item
        5): either the caller has no membership in the asserted tenant
        (code tenant_access_denied, raised by ResolveTenantFromHeader
        before the handler is reached), the acting membership does not
        hold the required capability (code missing_capability), or the
        acting membership mandates confirmed MFA and has not confirmed it
        (code mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    EventImmutableProblem:
      description: >-
        Problem document for a PATCH on a canceled event (stage-05a plan,
        endpoint table: "catalog.event_immutable (409, event is
        canceled)"). Editing a published event is allowed; only canceled
        is terminal.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [catalog.event_immutable]
      unevaluatedProperties: false
    EventNotPublishableProblem:
      description: >-
        Problem document for a publish on an event that is not in a
        publishable state (stage-05a plan, endpoint table:
        "catalog.event_not_publishable (409)"). Only a draft event can be
        published; an already-published or canceled event is rejected.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [catalog.event_not_publishable]
      unevaluatedProperties: false
    EventNotCancelableProblem:
      description: >-
        Problem document for a cancel on an event that is not in a
        cancelable state (stage-05a plan, endpoint table:
        "catalog.event_not_cancelable (409)"). A draft or published event
        can be canceled; an already-canceled event is rejected.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [catalog.event_not_cancelable]
      unevaluatedProperties: false
    TicketTypeForbiddenProblem:
      description: >-
        Problem document for a 403 on a ticket type endpoint, reading or
        mutating alike (both require a capability, events.view or
        events.manage respectively, stage-05a plan task breakdown item
        8): either the caller has no membership in the asserted tenant
        (code tenant_access_denied, raised by ResolveTenantFromHeader
        before the handler is reached), the acting membership does not
        hold the required capability (code missing_capability), or the
        acting membership mandates confirmed MFA and has not confirmed it
        (code mfa_enforcement_required).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [tenant_access_denied, missing_capability, mfa_enforcement_required]
      unevaluatedProperties: false
    TicketTypeUnprocessableProblem:
      description: >-
        Problem document for a ticket type create or update that cannot be
        processed: either request validation failed (with the errors map,
        code request.validation_failed), or the submitted price currency
        does not match the tenant's settlement currency (code
        catalog.currency_mismatch, stage-05a plan endpoint table),
        mirroring RoleUnprocessableProblem's own precedent for combining
        two distinct codes at the same status.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [catalog.currency_mismatch]
      unevaluatedProperties: false
    MembershipExistsProblem:
      description: >-
        Problem document for an invite whose target user already has a
        membership in the tenant.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [membership_exists]
      unevaluatedProperties: false
    LastOwnerRemovalProblem:
      description: >-
        Problem document for a role change or removal that would leave
        the tenant with no membership holding the global Owner template
        role.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [last_owner_removal]
      unevaluatedProperties: false
    InvitationTokenProblem:
      description: >-
        Problem document for a rejected staff invitation acceptance
        token: it is malformed, tampered with, or names a user that no
        longer resolves (code invitation_token_invalid), or its embedded
        expiry has passed (code invitation_token_expired).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [invitation_token_invalid, invitation_token_expired]
      unevaluatedProperties: false
    MfaAlreadyEnrolledProblem:
      description: >-
        Problem document for POST /v1/auth/mfa/enrollment when the caller
        has already confirmed MFA (stage-03 plan, task breakdown item 11).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [mfa_already_enrolled]
      unevaluatedProperties: false
    MfaConfirmProblem:
      description: >-
        Problem document for a 401 on POST /v1/auth/mfa/enrollment/confirm
        or POST /v1/auth/mfa/disable: a missing, invalid, or expired
        bearer token (code auth.unauthenticated), or a presented code that
        matches neither the current TOTP window nor any unused recovery
        code (code mfa_code_invalid).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [401]
            code:
              type: string
              enum: [auth.unauthenticated, mfa_code_invalid]
      unevaluatedProperties: false
    MfaNotEnrolledProblem:
      description: >-
        Problem document for POST /v1/auth/mfa/enrollment/confirm or POST
        /v1/auth/mfa/disable when no enrollment has ever been started
        (stage-03 plan, task breakdown item 11).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [mfa_not_enrolled]
      unevaluatedProperties: false
    MfaEnforcedForRoleProblem:
      description: >-
        Problem document for POST /v1/auth/mfa/disable when at least one
        of the caller's memberships is platform-scope or holds a
        financially privileged capability (stage-03 plan, MFA enforcement
        paragraph).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [403]
            code:
              type: string
              enum: [mfa_enforced_for_role]
      unevaluatedProperties: false
    InvalidQueryParameterProblem:
      description: >-
        Problem document for an unknown filter or sort parameter on an
        allowlisted list endpoint; unknown parameters are rejected, never
        ignored.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status:
              type: integer
              enum: [400]
            code:
              type: string
              enum: [invalid_query_parameter]
      unevaluatedProperties: false
    TenantUnprocessableProblem:
      description: >-
        Problem document for a tenant write that cannot be processed: either
        request validation failed (with the errors map) or the default
        locale falls outside the supported locales.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - oneOf:
            - type: object
              required:
                - errors
              properties:
                code:
                  type: string
                  enum: [request.validation_failed]
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            - type: object
              properties:
                code:
                  type: string
                  enum: [default_locale_not_supported]
      unevaluatedProperties: false
    Money:
      type: object
      description: >-
        Monetary value per docs/api-conventions.md: integer minor units paired
        with an uppercase ISO 4217 currency code. Amounts never appear on the
        wire without a currency, and never as floats.
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          description: >-
            Amount in the currency's minor units (e.g. centavos). May be
            negative (refunds, corrections).
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Uppercase ISO 4217 currency code.
      additionalProperties: false
    HealthReport:
      type: object
      required:
        - status
        - checks
        - checked_at
      properties:
        status:
          type: string
          enum: [ok]
          description: >-
            Always ok on a 200 response; degraded states are returned as the
            503 problem document.
        checks:
          $ref: '#/components/schemas/HealthChecks'
        checked_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of check execution.
      additionalProperties: false
    Problem:
      type: object
      description: >-
        RFC 9457 problem document shared by every error response under /v1
        per docs/api-conventions.md. Specific problems extend it with
        extension members.
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            Stable problem type URI reference, /problems/{slug} with the slug
            derived mechanically from code (dots and underscores become
            dashes).
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code of the response.
        detail:
          type: string
          description: >-
            Human-readable occurrence detail. Never stable contract; clients
            branch on code instead.
        code:
          type: string
          description: Stable machine-readable code; clients branch on this.
        correlation_id:
          type: string
          description: >-
            Echo of the request correlation ID also carried in the
            X-Correlation-Id response header.
    ValidationProblem:
      description: >-
        Problem document for failed request validation, extended with the
        errors map of field name to messages.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            status:
              type: integer
              enum: [422]
            code:
              type: string
              enum: [request.validation_failed]
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: Map of field name to validation messages.
      unevaluatedProperties: false
    HealthDegradedProblem:
      description: >-
        Problem document for the degraded health report, extended with the
        health checks. Frozen contract; the correlation ID travels only in
        the X-Correlation-Id header on this response.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - checks
            - checked_at
          properties:
            status:
              type: integer
              enum: [503]
            code:
              type: string
              enum: [health.degraded]
            checks:
              $ref: '#/components/schemas/HealthChecks'
            checked_at:
              type: string
              format: date-time
              description: ISO 8601 UTC timestamp of check execution.
      unevaluatedProperties: false
    HealthChecks:
      type: object
      required:
        - database
        - redis
        - storage
      properties:
        database:
          $ref: '#/components/schemas/CheckResult'
        redis:
          $ref: '#/components/schemas/CheckResult'
        storage:
          $ref: '#/components/schemas/CheckResult'
      additionalProperties: false
    CheckResult:
      type: string
      enum: [ok, failed]
