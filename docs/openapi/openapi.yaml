                $ref: '#/components/schemas/EventForbiddenProblem'
        '404':
          description: No event is visible with this id in the acting tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: >-
            The event is not in a cancelable state (code
            catalog.event_not_cancelable): a canceled event cannot be
            canceled again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventNotCancelableProblem'
  /v1/events/{event}/ticket-types:
    parameters:
      - name: event
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createTicketType
      summary: Create a ticket type under an event
      description: >-
        Tenant admin surface: Passport staff bearer, X-Tenant-Id membership
        validation, plus the events.manage capability (stage-05a plan,
        task breakdown item 8). Ticket types nest under their owning event
        for creation and listing only, per the api-conventions nesting
        rule; detail and update are top-level. price is Money on the wire
        ({amount, currency}); its currency must match the tenant's
        settlement currency (code catalog.currency_mismatch). Rejected
        with catalog.event_immutable when the parent event is canceled.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTypeCreateRequest'
      responses:
        '201':
          description: Ticket type created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketType'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            The caller has no membership in the asserted tenant (code
            tenant_access_denied), the acting membership does not hold
            events.manage (code missing_capability), or the acting
            membership mandates confirmed MFA and has not confirmed it
            (code mfa_enforcement_required).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketTypeForbiddenProblem'
        '409':
          description: The parent event is canceled and can no longer be modified.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventImmutableProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed,
            with the errors map): a negative price, a malformed currency
            code, or sales_end at or before sales_start; or the price
            currency does not match the tenant's settlement currency
            (code catalog.currency_mismatch).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketTypeUnprocessableProblem'
    get:
      operationId: listTicketTypes
      summary: List ticket types under an event
      description: >-
        Tenant admin surface: Passport staff bearer plus X-Tenant-Id
        membership validation, plus the events.view capability. Page
        pagination only; no filter, sort, or include allowlist (stage-05a
        plan endpoint table).
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of ticket types under the event.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTypePage'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            The caller has no membership in the asserted tenant (code
            tenant_access_denied), the acting membership does not hold
            events.view (code missing_capability), or the acting
            membership mandates confirmed MFA and has not confirmed it
            (code mfa_enforcement_required).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketTypeForbiddenProblem'
        '404':
          description: No event is visible with this id in the acting tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
  /v1/ticket-types/{ticket_type}:
    parameters:
      - name: ticket_type
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTicketType
      summary: Fetch one ticket type
      description: >-
        Tenant admin surface: Passport staff bearer, X-Tenant-Id membership
        validation, plus the events.view capability. A well-formed but
        nonexistent or foreign-tenant ticket type id renders the same
        generic request.not_found problem a malformed id gets from
        route-parameter matching: another tenant's ticket type is
        invisible under tenant_isolation RLS, so existence never leaks.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The ticket type.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketType'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            The caller has no membership in the asserted tenant (code
            tenant_access_denied), the acting membership does not hold
            events.view (code missing_capability), or the acting
            membership mandates confirmed MFA and has not confirmed it
            (code mfa_enforcement_required).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketTypeForbiddenProblem'
        '404':
          description: No ticket type is visible with this id in the acting tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
    patch:
      operationId: updateTicketType
      summary: Update a ticket type
      description: >-
        Tenant admin surface: Passport staff bearer, X-Tenant-Id membership
        validation, plus the events.manage capability. Every field is
        optional; a field absent from the payload is left untouched.
        sales_start and sales_end are each an all-or-nothing bundle:
        supplying part of the pair renders request.validation_failed.
        Rejected with catalog.event_immutable when the parent event is
        canceled; rejected with catalog.currency_mismatch when an updated
        price currency does not match the tenant's settlement currency.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTypeUpdateRequest'
      responses:
        '200':
          description: The updated ticket type.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketType'
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedProblem'
        '403':
          description: >-
            The caller has no membership in the asserted tenant (code
            tenant_access_denied), the acting membership does not hold
            events.manage (code missing_capability), or the acting
            membership mandates confirmed MFA and has not confirmed it
            (code mfa_enforcement_required).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketTypeForbiddenProblem'
        '404':
          description: No ticket type is visible with this id in the acting tenant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: The parent event is canceled and can no longer be modified.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EventImmutableProblem'
        '422':
          description: >-
            Request validation failed (code request.validation_failed,
            with the errors map): a negative price, a malformed currency
            code, or the sales window given only in part; or the price
            currency does not match the tenant's settlement currency
            (code catalog.currency_mismatch).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketTypeUnprocessableProblem'
  /v1/storefront/events:
    get:
      operationId: listStorefrontEvents
      summary: List a tenant's published events
      description: >-
        Storefront surface: unauthenticated, tenant resolved from the Host
        header against tenant_domains (system-design 4.1). Returns only the
        published events of the resolved tenant, ordered by start_at
        ascending; drafts and canceled events are never visible. name and
        description are resolved to single strings in the negotiated locale
        (explicit locale query parameter, then Accept-Language, then the
        tenant default; only tenant-supported locales are honored, and a
        missing translation falls back to the tenant default) and the
        response carries a Content-Language header.
      parameters:
        - name: locale
          in: query
          required: false
          description: Preferred locale; honored only when the tenant supports it.
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of published events for the resolved tenant.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontEventPage'
  /v1/storefront/events/{event}:
    parameters:
      - name: event
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStorefrontEvent
      summary: Fetch one published event
      description: >-
        Storefront surface: unauthenticated, tenant resolved from the Host
        header. A draft, canceled, foreign-tenant, or nonexistent event id
        all render the same request.not_found problem, so unpublished
        existence never leaks. name and description are resolved in the
        negotiated locale (see the list endpoint) and ticket types are
        embedded; the response carries a Content-Language header.
      parameters:
        - name: locale
          in: query
          required: false
          description: Preferred locale; honored only when the tenant supports it.
          schema:
            type: string
      responses:
        '200':
          description: The published event with its ticket types.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontEvent'
        '404':
          description: >-
            No published event is visible with this id for the resolved
            tenant (drafts, canceled, and foreign-tenant events included).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Passport-issued JWT access token (docs/decisions/011). Carries
        identity_type and, for customers only, tenant_id.
  headers:
    XCorrelationId:
      description: Echo of the request correlation ID per docs/api-conventions.md.
      schema:
        type: string
        format: uuid
    ContentLanguage:
      description: The negotiated locale the storefront response was resolved in.
      schema:
        type: string
  schemas:
    StaffTokenRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        mfa_code:
          type: [string, 'null']
          description: >-
            Required once the user has confirmed MFA: either the current
            TOTP code or an unused recovery code (stage-03 plan, task
            breakdown item 11).
      additionalProperties: false
    TokenPair:
      type: object
      description: >-
        OAuth 2.0 bearer token pair issued by Passport's password grant
        (docs/decisions/011).
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: Short-lived JWT; see BearerAuth for its claims.
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
      additionalProperties: false
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
      additionalProperties: false
    CustomerTokenRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      additionalProperties: false
    RegisterCustomerRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: [string, 'null']
          description: >-
            Omitted or null creates an unclaimed guest (docs/decisions/007).
        locale:
          type: [string, 'null']
          description: Falls back to the tenant's default_locale when omitted.
      additionalProperties: false
    Customer:
      type: object
      required:
        - id
        - email
        - name
        - locale
        - is_claimed
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        locale:
          type: string
        is_claimed:
          type: boolean
          description: True once the customer holds a password (registered or claimed).
      additionalProperties: false
    ClaimRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
      additionalProperties: false
    ConfirmClaimRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
      additionalProperties: false
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
      additionalProperties: false
    ConfirmPasswordResetRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
      additionalProperties: false
    Membership:
      type: object
      description: >-
        One row of CurrentUser.memberships: the caller's own membership in
        one tenant (scope tenant) or their platform-scope administrator
        membership (scope platform, tenant_id the sentinel platform
        tenant). Also the response shape for POST /v1/memberships and
        PATCH /v1/memberships/{membership}, and the element type of
        MembershipPage's data (stage-03 plan, task breakdown item 9).
      required:
        - id
        - user_id
        - user_name
        - user_email
        - tenant_id
        - role_id
        - role_name
        - scope
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        user_email:
          type: string
          format: email
        tenant_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        role_name:
          type: string
        scope:
          type: string
          enum: [tenant, platform]
      additionalProperties: false
    MembershipPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false
    InviteUserRequest:
      type: object
      required:
        - email
        - name
        - role_id
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role_id:
          type: string
          format: uuid
      additionalProperties: false
    ChangeMembershipRoleRequest:
      type: object
      required:
        - role_id
      properties:
        role_id:
          type: string
          format: uuid
      additionalProperties: false
    AcceptInvitationRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
      additionalProperties: false
    CurrentUser:
      type: object
      required:
        - id
        - name
        - email
        - mfa_enabled
        - memberships
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        mfa_enabled:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      additionalProperties: false
    MfaEnrollment:
      type: object
      description: >-
        Response for POST /v1/auth/mfa/enrollment (stage-03 plan, task
        breakdown item 11). The secret is not yet confirmed; POST
        /v1/auth/mfa/enrollment/confirm verifies a code against it.
      required:
        - secret
        - otpauth_uri
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
          description: otpauth:// URI for an authenticator app to scan or import.
      additionalProperties: false
    ConfirmMfaRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: The current TOTP code from the pending secret's authenticator app.
      additionalProperties: false
    MfaRecoveryCodes:
      type: object
      description: >-
        Response for POST /v1/auth/mfa/enrollment/confirm. The plaintext
        codes are returned here only and never again.
      required:
        - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
      additionalProperties: false
    DisableMfaRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: A current TOTP code or a still-unused recovery code.
      additionalProperties: false
    BrandingSettings:
      type: object
      description: >-
        Tenant branding configuration. JSON configuration only in this stage;
        the logo becomes a media upload when media infrastructure lands.
      properties:
        primary_color:
          type: [string, 'null']
        logo_url:
          type: [string, 'null']
      additionalProperties: false
    Tenant:
      type: object
      required:
        - id
        - name
        - branding_settings
        - default_locale
        - supported_locales
        - enabled_gateways
        - payout_schedule
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        branding_settings:
          $ref: '#/components/schemas/BrandingSettings'
        default_locale:
          type: string
        supported_locales:
          type: array
          items:
            type: string
        enabled_gateways:
          type: array
          items:
            type: string
        payout_schedule:
          type: [object, 'null']
