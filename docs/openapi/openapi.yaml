        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    SeatMapUpsertRequest:
      type: object
      required:
        - name
        - layout
        - seats
      properties:
        name:
          type: string
        layout:
          type: object
        seats:
          type: array
          maxItems: 50000
          items:
            $ref: '#/components/schemas/SeatInput'
      additionalProperties: false
    SeatMapSummary:
      type: object
      description: >-
        List-row shape for GET /v1/venues/{venue}/seat-maps (stage-05b
        plan, Endpoints): no seats or layout, unlike SeatMap, plus the
        aggregated seat_count.
      required:
        - id
        - venue_id
        - name
        - seat_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        name:
          type: string
        seat_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    SeatMapPage:
      type: object
      description: >-
        Laravel standard paginator envelope (data, links, meta) per
        docs/api-conventions.md.
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
