# Local development stack (research.md R4): PostgreSQL, Redis, MinIO, and the API
# (FrankenPHP/Octane, built from apps/api/Dockerfile). Frontends run on the host via
# `pnpm dev` against the API exposed here (docs/decisions/017-containers-first-defer-orchestrator.md).
#
# Wired for the root Makefile (T015) to plug in: every credential and port below is a
# ${VAR:-default} so a root .env can override any of them, and the stack still runs
# standalone with the defaults shown.
#
# Usage: docker compose -f infra/compose/docker-compose.yml up

name: nodia

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nodia_api}
      POSTGRES_USER: ${DB_USERNAME:-nodia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nodia}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nodia} -d ${DB_DATABASE:-nodia_api}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nodia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nodia12345}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-nodia} ${MINIO_ROOT_PASSWORD:-nodia12345} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-nodia}
      "

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-base64:+WkHmoGlRETXZ9S8PSOW11+hKN8zZAPMpABqJuK9pNs=}
      APP_URL: http://localhost:${API_PORT:-8000}

      LOG_CHANNEL: stdout
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-nodia_api}
      DB_USERNAME: ${DB_USERNAME:-nodia}
      DB_PASSWORD: ${DB_PASSWORD:-nodia}

      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: ${SESSION_DRIVER:-database}

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null

      # Wired to MinIO so the s3 disk works once league/flysystem-aws-s3-v3 is
      # installed and FILESYSTEM_DISK is switched to s3; default disk stays local
      # until then, matching apps/api/.env.example.
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-nodia}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-nodia12345}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-nodia}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"

      OCTANE_SERVER: frankenphp
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  minio-data:
