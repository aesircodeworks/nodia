openapi: 3.1.0
info:
  title: Nodia API - Health
  description: >-
    Health contract for the project foundation phase. This fragment is merged
    into the repository OpenAPI specification (docs/openapi/openapi.yaml) per
    docs/api-conventions.md. The response shapes are generated from
    laravel-data objects; this document mirrors them and must not drift from
    them.
  version: 1.1.0
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report API health and backing service connectivity
      description: >-
        Unauthenticated. Returns 200 when all backing services are reachable,
        503 as an RFC 9457 problem document when any check fails. Every
        response echoes the X-Correlation-Id header per
        docs/api-conventions.md.
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Correlation ID; generated by the server when absent.
      responses:
        '200':
          description: All backing services reachable.
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
              examples:
                healthy:
                  value:
                    status: ok
                    checks:
                      database: ok
                      redis: ok
                      storage: ok
                    checked_at: '2026-07-04T12:00:00Z'
        '503':
          description: >-
            At least one backing service check failed. RFC 9457 problem
            document per docs/api-conventions.md, with the health checks
            carried as extension members.
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HealthDegradedProblem'
              examples:
                degraded:
                  value:
                    type: '/problems/health-degraded'
                    title: 'Service degraded'
                    status: 503
                    detail: 'One or more backing services failed their health check.'
                    code: 'health.degraded'
                    checks:
                      database: ok
                      redis: failed
                      storage: ok
                    checked_at: '2026-07-04T12:00:00Z'
components:
  schemas:
    HealthReport:
      type: object
      required:
        - status
        - checks
        - checked_at
      properties:
        status:
          type: string
          enum: [ok]
          description: >-
            Always ok on a 200 response; degraded states are returned as the
            503 problem document.
        checks:
          $ref: '#/components/schemas/HealthChecks'
        checked_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of check execution.
      additionalProperties: false
    HealthDegradedProblem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - checks
        - checked_at
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable problem type URI reference.
        title:
          type: string
        status:
          type: integer
          enum: [503]
        detail:
          type: string
        code:
          type: string
          enum: [health.degraded]
          description: Stable machine-readable code; clients branch on this.
        checks:
          $ref: '#/components/schemas/HealthChecks'
        checked_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of check execution.
      additionalProperties: false
    HealthChecks:
      type: object
      required:
        - database
        - redis
        - storage
      properties:
        database:
          $ref: '#/components/schemas/CheckResult'
        redis:
          $ref: '#/components/schemas/CheckResult'
        storage:
          $ref: '#/components/schemas/CheckResult'
      additionalProperties: false
    CheckResult:
      type: string
      enum: [ok, failed]
